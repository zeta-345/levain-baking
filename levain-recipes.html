<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>르방 베이킹 레시피</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-recipes.json">
<meta name="theme-color" content="#8A5A34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFFFF;
    --olive: #171717;
    --olive-dark: #111111;
    --crust: #6B6B6B;
    --crust-dark: #333333;
    --ink: #1A1A1A;
    --oil: #171717;
    --accent: #8A5A34;
    --paper: #FFFFFF;
    --line: rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; }

  #splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: #F3E8D8;
    transition: opacity 0.4s ease;
  }
  #splash-screen .splash-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  #splash-screen img {
    width: 88px;
    height: 88px;
    border-radius: 20px;
  }
  #splash-screen .splash-dots {
    display: flex;
    gap: 10px;
  }
  #splash-screen .splash-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* 처음 실행: 큰 아이콘이 줄어들고, 점이 뒤이어 순차 등장 */
  #splash-screen.first-launch img {
    animation: iconShrink 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes iconShrink {
    0% { transform: scale(2.1); }
    100% { transform: scale(1); }
  }
  #splash-screen.first-launch .splash-dots {
    opacity: 0;
    animation: dotsReveal 0.3s ease-out 0.45s both;
  }
  @keyframes dotsReveal {
    0% { opacity: 0; transform: translateY(4px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  #splash-screen.first-launch .splash-dot {
    animation: splashDotFade 1.2s ease-in-out infinite;
    animation-delay: 0.45s;
  }
  #splash-screen.first-launch .splash-dot:nth-child(2) { animation-delay: 0.65s; }
  #splash-screen.first-launch .splash-dot:nth-child(3) { animation-delay: 0.85s; }

  /* 새로고침/재방문: 전체가 살짝 커지면서 페이드인 */
  #splash-screen.refresh .splash-content {
    animation: splashIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes splashIn {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }
  #splash-screen.refresh .splash-dot {
    animation: splashDotFade 1.2s ease-in-out infinite;
  }
  #splash-screen.refresh .splash-dot:nth-child(1) { animation-delay: 0s; }
  #splash-screen.refresh .splash-dot:nth-child(2) { animation-delay: 0.2s; }
  #splash-screen.refresh .splash-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes splashDotFade {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }
  #splash-screen.hide {
    opacity: 0;
    pointer-events: none;
  }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 80px; }
  a { color: inherit; text-decoration: none; }

  /* Top bar (shown on detail view) */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 20px;
    display: none;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--olive);
    cursor: pointer;
    padding: 6px 0;
  }
  .back-btn:hover { text-decoration: underline; }

  /* ===== HOME VIEW ===== */
  .site-hero {
    padding: 60px 20px 34px;
    text-align: center;
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,0,0,0.035), transparent),
      var(--paper);
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--olive);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .site-hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 46px;
    line-height: 1.05;
    margin: 0 0 12px;
    color: var(--olive-dark);
  }
  .site-hero p {
    font-family: 'Fraunces', serif;
    max-width: 440px;
    margin: 0 auto;
    color: #555555;
    font-size: 15px;
    line-height: 1.55;
  }

  .starter-strip {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .starter-stat {
    text-align: center;
  }
  .starter-stat .n {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    color: var(--crust-dark);
    font-weight: 600;
  }
  .starter-stat .l {
    font-size: 11.5px;
    color: #777777;
    letter-spacing: 0.03em;
  }

  .levain-status-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F5F5F5;
    color: #333333;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    text-decoration: none;
    margin-bottom: 8px;
    transition: opacity 0.15s;
  }
  .levain-status-card:hover { opacity: 0.85; }
  .levain-status-card .l-label {
    font-size: 11px;
    color: #999999;
    margin-bottom: 2px;
  }
  .levain-status-card .l-value {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--olive-dark);
  }
  .levain-status-card .l-sub {
    font-size: 11px;
    color: #999999;
    margin-top: 2px;
  }
  .levain-status-card .l-arrow {
    font-size: 15px;
    color: var(--accent);
    opacity: 0.8;
  }

  .hero-divider {
    border-bottom: 1px solid var(--line);
    margin: 22px 0 24px;
  }

  .search-box {
    position: relative;
    margin: 22px 0 18px;
  }
  .search-box input {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Public Sans', sans-serif;
    font-size: 14.5px;
    padding: 13px 16px 13px 40px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }
  .search-box input:focus { border-color: var(--olive); }
  .search-box .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.45;
    pointer-events: none;
  }
  .search-empty {
    text-align: center;
    padding: 30px 10px;
    color: #999999;
    font-size: 13.5px;
  }
  .search-hit-tag {
    display: inline-block;
    font-size: 10.5px;
    color: var(--accent);
    background: rgba(138,90,52,0.1);
    padding: 2px 7px;
    border-radius: 8px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .recipe-grid {
    padding: 40px 0 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .recipe-card {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    cursor: pointer;
    transition: border-color .15s ease, transform .12s ease;
  }
  .recipe-card:hover { border-color: var(--olive); transform: translateY(-1px); }
  .recipe-icon {
    flex-shrink: 0;
    width: 54px; height: 54px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: rgba(0,0,0,0.05);
  }
  .recipe-info { flex: 1; }
  .recipe-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--olive-dark);
    margin-bottom: 3px;
  }
  .recipe-meta {
    font-size: 12.5px;
    color: #777777;
  }
  .cat-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .cat-plain  { background: #D9B98F; }
  .cat-sweet  { background: #F0B4BE; }
  .cat-savory { background: #F0CA85; }
  .cat-oil    { background: #A9C7A3; }
  .recipe-arrow {
    font-size: 18px;
    color: var(--olive);
    flex-shrink: 0;
  }
  .recipe-card.disabled {
    opacity: 0.45;
    cursor: default;
  }
  .recipe-card.disabled:hover { transform: none; border-color: var(--line); }
  .soon-tag {
    font-size: 10.5px;
    background: var(--olive);
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
    letter-spacing: 0.02em;
  }

  footer.site-footer {
    text-align: center;
    padding: 40px 0 0;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13.5px;
    color: #999999;
  }

  /* ===== DETAIL VIEW ===== */
  .hero {
    padding: 40px 20px 36px;
    text-align: center;
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,0,0,0.035), transparent),
      var(--paper);
    border-bottom: 1px solid var(--line);
  }
  h1.recipe-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 46px;
    line-height: 1.02;
    margin: 0 0 14px;
    color: var(--olive-dark);
  }
  .hero p.desc {
    font-family: 'Fraunces', serif;
    max-width: 460px;
    margin: 0 auto;
    color: #555555;
    font-size: 15px;
    line-height: 1.55;
  }

  .dimple-map { margin: 24px auto 0; width: 230px; height: 150px; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
  .dimple-map svg { width: 100%; height: auto; display: block; }
  .dimple-map img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .servings-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 28px;
  }
  .servings-bar button {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--olive);
    background: var(--paper);
    color: var(--olive-dark);
    font-size: 19px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, transform .1s ease;
  }
  .servings-bar button:hover { background: var(--olive); color: var(--paper); }
  .servings-bar button:active { transform: scale(0.92); }
  .servings-label {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    min-width: 118px;
    text-align: center;
  }
  .servings-label b { font-size: 15px; font-weight: 400; }
  .servings-label #servings-unit-label { font-family: 'Fraunces', serif; font-size: 15px; }

  section.body-section { padding: 40px 0 0; }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 25px;
    color: var(--olive-dark);
    margin: 0 0 4px;
  }
  .section-sub {
    color: #777777;
    font-size: 13.5px;
    margin-bottom: 20px;
  }

  .ingredient-list { list-style: none; padding: 0; margin: 0; }
  .ingredient-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .ingredient-list li:last-child { border-bottom: none; }
  .ing-tag {
    font-size: 11.5px;
    color: var(--crust);
    background: rgba(0,0,0,0.05);
    padding: 2px 7px;
    border-radius: 20px;
    margin-left: 8px;
  }
  .ing-amt {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }

  .cake-variant-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .cake-variant-btn {
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--olive-dark);
    cursor: pointer;
    transition: all .15s ease;
  }
  .cake-variant-btn:hover { border-color: var(--olive); }
  .cake-variant-btn.active {
    background: var(--olive);
    border-color: var(--olive);
    color: var(--paper);
  }

  .topping-wrap {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px dashed var(--line);
  }
  .topping-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--olive);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .topping-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topping-row + .topping-row { margin-top: 8px; }
  .topping-btn {
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--olive-dark);
    cursor: pointer;
    transition: all .15s ease;
  }
  .topping-btn:hover { border-color: var(--olive); }
  .topping-btn.active {
    background: var(--olive);
    border-color: var(--olive);
    color: var(--paper);
  }
  .topping-btn.sub {
    border-color: rgba(0,0,0,0.18);
    font-weight: 500;
  }
  .topping-btn.sub.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
  }
  .topping-extra-list {
    list-style: none;
    padding: 0;
    margin: 14px 0 0;
    background: rgba(0,0,0,0.025);
    border-radius: 12px;
    overflow: hidden;
  }
  .topping-extra-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .topping-extra-list li:last-child { border-bottom: none; }

  .leavening-wrap {
    max-width: 720px;
    margin: 24px auto 0;
    padding: 0 20px;
    box-sizing: border-box;
  }
  .leavening-card {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    background: var(--paper);
  }
  .leavening-label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #999999;
    margin-bottom: 10px;
  }
  .leavening-row {
    display: flex;
    background: rgba(0,0,0,0.045);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .leavening-btn {
    flex: 1;
    font-family: 'Public Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--olive-dark);
    cursor: pointer;
    transition: all .15s ease;
  }
  .leavening-btn.active {
    background: var(--olive);
    color: var(--paper);
  }
  .leavening-note {
    margin-top: 10px;
    font-size: 12.5px;
    color: #888888;
    line-height: 1.5;
  }

  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: opacity .2s ease;
  }
  .step.done { opacity: 0.5; }
  .step-check {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--olive);
    margin-top: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    font-size: 14px;
    transition: all .15s ease;
  }
  .step.done .step-check { background: var(--olive); color: var(--paper); }
  .step-body { flex: 1; }
  .step-title { font-weight: 700; font-size: 15.5px; margin-bottom: 4px; color: var(--olive-dark); }
  .step-text { font-size: 14.5px; line-height: 1.6; color: #333333; }
  .step-text b { color: var(--accent); font-variant-numeric: tabular-nums; }

  .timer-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .timer-btn {
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--crust);
    background: transparent;
    color: var(--crust-dark);
    cursor: pointer;
  }
  .timer-btn:hover { background: rgba(0,0,0,0.05); }
  .timer-display { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--crust-dark); font-weight: 600; }
  .timer-btn.running { background: var(--crust); color: var(--paper); }

  .note {
    margin-top: 44px;
    background: #F5F5F5;
    color: #333333;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 24px;
    font-size: 14.5px;
    line-height: 1.65;
  }
  .note b { color: var(--accent); }

  footer.recipe-footer {
    text-align: center;
    padding: 30px 0 0;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13.5px;
    color: #999999;
  }

  @media (max-width: 480px) {
    .site-hero h1 { font-size: 34px; }
    h1.recipe-title { font-size: 34px; }
  }
</style>
</head>
<body>

<div id="splash-screen">
  <div class="splash-content">
    <img src="icon-192.png" alt="르방 베이킹 레시피">
    <div class="splash-dots">
      <span class="splash-dot"></span>
      <span class="splash-dot"></span>
      <span class="splash-dot"></span>
    </div>
  </div>
</div>
<script>
  (function () {
    var splash = document.getElementById('splash-screen');
    if (sessionStorage.getItem('splashSeen')) {
      splash.classList.add('refresh');
    } else {
      splash.classList.add('first-launch');
      sessionStorage.setItem('splashSeen', '1');
    }
  })();
</script>

<div class="topbar" id="topbar">
  <div class="back-btn" id="back-btn">← 레시피 목록</div>
</div>

<!-- ===== HOME VIEW ===== -->
<div id="home-view">
  <div class="site-hero">
    <div class="eyebrow">Levain Baking Notebook</div>
    <h1>르방 베이킹 레시피</h1>
    <p>내 르방으로 만드는 빵 모음. 인분을 조절하면 재료량이 자동으로 바뀌고, 발효·굽기 단계는 타이머로 확인할 수 있어요.</p>
    <div class="starter-strip">
      <div class="starter-stat"><div class="n">6~7h</div><div class="l">평균 피크 타임</div></div>
      <div class="starter-stat"><div class="n" id="stat-completed">-</div><div class="l">완성 레시피</div></div>
      <div class="starter-stat"><div class="n" id="stat-upcoming">-</div><div class="l">도전 예정</div></div>
    </div>
  </div>

  <div class="wrap">
    <a href="levain-log.html" class="levain-status-card" id="levain-status-card">
      <div>
        <div class="l-label">마지막 급식으로부터</div>
        <div class="l-value" id="levain-status-value">기록 없음</div>
        <div class="l-sub" id="levain-status-sub">발효 기록 보러 가기</div>
      </div>
      <div class="l-arrow">→</div>
    </a>
    <div class="hero-divider"></div>
    <div class="search-box">

let currentRecipe = null;
let servings = 4;
const timerStates = {};
let selectedToppingCategoryIdx = 0;
let selectedToppingOptionId = null;
let leaveningMode = 'levain'; // 'levain' | 'yeast'
let selectedCakeVariantId = null;

function isYeastMode() {
  return leaveningMode === 'yeast' && !!(currentRecipe && currentRecipe.yeastVersion);
}
function getActiveCakeVariant() {
  if (!currentRecipe || !currentRecipe.cakeVariants) return null;
  return currentRecipe.cakeVariants.find(v => v.id === selectedCakeVariantId) || currentRecipe.cakeVariants[0];
}
function getActiveIngredients() {
  const variant = getActiveCakeVariant();
  if (variant) return variant.ingredients;
  return isYeastMode() ? currentRecipe.yeastVersion.ingredients : currentRecipe.ingredients;
}
function getActiveSteps() {
  const variant = getActiveCakeVariant();
  if (variant) return variant.steps;
  return isYeastMode() ? currentRecipe.yeastVersion.steps : currentRecipe.steps;
}
function getActiveNote() {
  const variant = getActiveCakeVariant();
  if (variant) return variant.note;
  return isYeastMode() ? currentRecipe.yeastVersion.note : currentRecipe.note;
}
function getActiveDesc() {
  const variant = getActiveCakeVariant();
  return variant ? variant.desc : currentRecipe.desc;
}
function getActiveImage() {
  const variant = getActiveCakeVariant();
  return variant ? variant.image : currentRecipe.image;
}

function renderCakeVariantSection() {
  const container = document.getElementById('cake-variant-section');
  container.innerHTML = '';
  if (!currentRecipe.cakeVariants || currentRecipe.cakeVariants.length < 2) return;

  const row = document.createElement('div');
  row.className = 'cake-variant-row';
  currentRecipe.cakeVariants.forEach(variant => {
    const btn = document.createElement('button');
    btn.className = 'cake-variant-btn' + (variant.id === selectedCakeVariantId ? ' active' : '');
    btn.textContent = variant.label;
    btn.addEventListener('click', () => {
      selectedCakeVariantId = variant.id;
      renderCakeVariantSection();
      renderVisual();
      renderIngredients();
      renderSteps();
      document.getElementById('detail-desc').textContent = getActiveDesc();
      document.getElementById('detail-note').innerHTML = '<b>메모.</b> ' + getActiveNote();
    });
    row.appendChild(btn);
  });
  container.appendChild(row);
}

function renderLeaveningToggle() {
  const container = document.getElementById('leavening-toggle');
  if (!currentRecipe.yeastVersion) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = 'block';
  container.innerHTML = `
    <div class="leavening-card">
      <div class="leavening-label">발효종 선택</div>
      <div class="leavening-row">
        <button class="leavening-btn${leaveningMode === 'levain' ? ' active' : ''}" data-mode="levain">르방 버전</button>
        <button class="leavening-btn${leaveningMode === 'yeast' ? ' active' : ''}" data-mode="yeast">이스트 버전</button>
      </div>
    </div>
  `;
  container.querySelectorAll('.leavening-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      leaveningMode = btn.dataset.mode;
      renderLeaveningToggle();
      renderIngredients();
      renderSteps();
      document.getElementById('detail-note').innerHTML = '<b>메모.</b> ' + getActiveNote();
    });
  });
}

function fmtElapsedShort(ms) {
  if (ms == null || ms < 0) return '-';
  const totalMin = Math.floor(ms / 60000);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d === 0 && h === 0 && m === 0) return '0h';
  let out = '';
  if (d > 0) out += `${d}d `;
  if (h > 0 || d > 0) out += `${h}h`;
  if (m > 0) out += `${m}m`;
  return out.trim();
}

function renderLevainStatusCard() {
  const valueEl = document.getElementById('levain-status-value');
  const subEl = document.getElementById('levain-status-sub');
  if (!valueEl) return;

  let entries = [];
  try {
    const raw = localStorage.getItem('levain-log-entries');
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) {
    entries = [];
  }

  let lastFeeding = null;
  entries = entries.slice().sort((a, b) => new Date(a.ts) - new Date(b.ts));
  for (let i = entries.length - 1; i >= 0; i--) {
    if (entries[i].isFeeding) { lastFeeding = entries[i]; break; }
  }

  if (!lastFeeding) {
    valueEl.textContent = '기록 없음';
    subEl.textContent = '발효 기록 시작하기';
    return;
  }

  const diff = Date.now() - new Date(lastFeeding.ts).getTime();
  valueEl.textContent = fmtElapsedShort(diff) + ' 경과';
  subEl.textContent = '발효 기록 보러 가기';
}
setInterval(renderLevainStatusCard, 30000);

  { icon: '🥧', name: '파이', category: 'sweet' },
];

// 검색어/텍스트 동의어 정규화 (예: 계란 <-> 달걀처럼 표기가 달라도 같은 검색 결과가 나오도록)
const SEARCH_SYNONYMS = [
  ['계란', '달걀'],
];
function normalizeSearchText(text) {
  let result = text;
  SEARCH_SYNONYMS.forEach(([a, b]) => {
    result = result.split(a).join(b);
  });
  return result;
}

// 레시피 하나가 검색어와 매치되는지 확인하고, 어디서 매치됐는지(제목/재료/과정) 반환
function matchRecipe(r, q) {
  q = normalizeSearchText(q);
  const norm = (s) => normalizeSearchText((s || '').toLowerCase());
  if (norm(r.name).includes(q)) return '제목';
  if (norm(r.meta).includes(q) || norm(r.desc).includes(q)) return '제목';
  if ((r.ingredients || []).some(i =>
    norm(i.name).includes(q) ||
    norm(i.tag).includes(q) ||
    String(i.base).includes(q) ||
    `${i.base}${i.unit}`.toLowerCase().includes(q)
  )) return '재료';
  if (r.yeastVersion && (r.yeastVersion.ingredients || []).some(i =>
    norm(i.name).includes(q) ||
    norm(i.tag).includes(q) ||
    String(i.base).includes(q) ||
    `${i.base}${i.unit}`.toLowerCase().includes(q)
  )) return '재료';
  if ((r.steps || []).some(s => norm(s.title).includes(q) || norm(s.text).includes(q))) return '과정';
  if (r.yeastVersion && (r.yeastVersion.steps || []).some(s => norm(s.title).includes(q) || norm(s.text).includes(q))) return '과정';
  if ((r.toppingOptions || []).some(cat =>
    cat.options.some(opt =>
      norm(opt.name).includes(q) ||
      (opt.ingredients || []).some(i =>
        norm(i.name).includes(q) ||
        String(i.base).includes(q) ||
        `${i.base}${i.unit}`.toLowerCase().includes(q)
      )
    )
  )) return '재료';
  return null;
}

function renderHome() {
  renderLevainStatusCard();

  document.getElementById('stat-completed').textContent = RECIPES.length;
  document.getElementById('stat-upcoming').textContent = UPCOMING_RECIPES.length;

  const grid = document.getElementById('recipe-grid');
  const searchInput = document.getElementById('recipe-search');
  const q = (searchInput.value || '').trim().toLowerCase();
  grid.innerHTML = '';

  const filteredRecipes = q
    ? RECIPES.map(r => ({ r, hit: matchRecipe(r, q) })).filter(x => x.hit)
    : RECIPES.map(r => ({ r, hit: null }));

  filteredRecipes.forEach(({ r, hit }) => {
    const card = document.createElement('div');
    card.className = 'recipe-card';
    card.innerHTML = `
      <div class="recipe-icon">${r.icon}</div>
      <div class="recipe-info">
        <div class="recipe-name"><span class="cat-dot cat-${r.category}"></span>${r.name}${hit ? `<span class="search-hit-tag">${hit} 일치</span>` : ''}</div>
        <div class="recipe-meta">${r.meta}</div>
      </div>
      <div class="recipe-arrow">→</div>
    `;
    card.addEventListener('click', () => openRecipe(r.id));
    grid.appendChild(card);
  });

  // 준비 중 카드는 이름으로만 검색 대상에 포함 (검색어 없을 때는 항상 표시)
  const filteredUpcoming = q
    ? UPCOMING_RECIPES.filter(u => u.name.toLowerCase().includes(q))
    : UPCOMING_RECIPES;

  filteredUpcoming.forEach(u => {
    const card = document.createElement('div');
    card.className = 'recipe-card disabled';
    card.innerHTML = `
      <div class="recipe-icon">${u.icon}</div>
      <div class="recipe-info">
        <div class="recipe-name"><span class="cat-dot cat-${u.category}"></span>${u.name}<span class="soon-tag">준비 중</span></div>
        <div class="recipe-meta">레시피 추가 예정</div>
      </div>
    `;
    grid.appendChild(card);
  });

  if (q && filteredRecipes.length === 0 && filteredUpcoming.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.textContent = `"${searchInput.value.trim()}"에 대한 검색 결과가 없어요.`;
    grid.appendChild(empty);
  }
}

/* =========================================================
   상세 뷰 렌더링
   ========================================================= */
function openRecipe(id) {
  currentRecipe = RECIPES.find(r => r.id === id);
  servings = currentRecipe.baseServings;
  leaveningMode = 'levain';

  document.getElementById('home-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('topbar').style.display = 'block';
  window.scrollTo(0, 0);

  selectedCakeVariantId = currentRecipe.cakeVariants ? currentRecipe.cakeVariants[0].id : null;

  document.getElementById('detail-eyebrow').textContent = currentRecipe.icon + '  ' + currentRecipe.name;
  document.getElementById('detail-title').textContent = currentRecipe.name;
  document.getElementById('detail-desc').textContent = getActiveDesc();
  document.getElementById('detail-note').innerHTML = '<b>메모.</b> ' + getActiveNote();
  document.getElementById('servings-unit-label').textContent = computeUnitLabel(currentRecipe, servings);
  document.getElementById('servings-num').textContent = servings;

  selectedToppingCategoryIdx = 0;
  selectedToppingOptionId = null;
  if (currentRecipe.toppingOptions) {
    const firstCat = currentRecipe.toppingOptions[0];
    const def = firstCat.options.find(o => o.default) || firstCat.options[0];
    selectedToppingOptionId = def.id;
  }

  renderLeaveningToggle();
  renderVisual();
  renderCakeVariantSection();
  renderIngredients();
  renderToppingSection();
  renderSteps();
}

function closeRecipe() {
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  currentRecipe = null;
  window.scrollTo(0, 0);
}

function fmtAmount(n) {
  return Math.round(n).toString();
}

function computeUnitLabel(rec, s) {
  if (rec.panServings) {
    const panCount = Math.ceil(s / rec.panServings);
    return `인분 · 팬 ${panCount}개`;
  }
  return rec.servingsUnit;
}

function getSelectedToppingOption() {
  if (!currentRecipe || !currentRecipe.toppingOptions) return null;
  const cat = currentRecipe.toppingOptions[selectedToppingCategoryIdx];
  if (!cat) return null;
  return cat.options.find(o => o.id === selectedToppingOptionId) || cat.options[0];
}

function renderToppingSection() {
  const container = document.getElementById('topping-section');
  container.innerHTML = '';
  if (!currentRecipe.toppingOptions) return;

  const wrap = document.createElement('div');
  wrap.className = 'topping-wrap';

  // 카테고리 행
  const label = document.createElement('div');
  label.className = 'topping-label';
  label.textContent = '토핑 선택';
  wrap.appendChild(label);

  const catRow = document.createElement('div');
  catRow.className = 'topping-row';
  currentRecipe.toppingOptions.forEach((cat, idx) => {
    const btn = document.createElement('button');
    btn.className = 'topping-btn' + (idx === selectedToppingCategoryIdx ? ' active' : '');
    btn.textContent = cat.category;
    btn.addEventListener('click', () => {
      selectedToppingCategoryIdx = idx;
      const def = cat.options.find(o => o.default) || cat.options[0];
      selectedToppingOptionId = def.id;
      renderToppingSection();
      renderSteps();
    });
    catRow.appendChild(btn);
  });
  wrap.appendChild(catRow);

  // 세부 옵션 행
  const subRow = document.createElement('div');
  subRow.className = 'topping-row';
  const currentCat = currentRecipe.toppingOptions[selectedToppingCategoryIdx];
  currentCat.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'topping-btn sub' + (opt.id === selectedToppingOptionId ? ' active' : '');
    btn.textContent = opt.name;
    btn.addEventListener('click', () => {
      selectedToppingOptionId = opt.id;
      renderToppingSection();
      renderSteps();
    });
    subRow.appendChild(btn);
  });
  wrap.appendChild(subRow);

  // 선택된 토핑의 재료
  const selected = getSelectedToppingOption();
  if (selected && selected.ingredients && selected.ingredients.length) {
    const ul = document.createElement('ul');
    ul.className = 'topping-extra-list';
    selected.ingredients.forEach(ing => {
      const scaled = ing.base * (servings / currentRecipe.baseServings);
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="ing-name">${ing.name}${ing.tag ? `<span class="ing-tag">${ing.tag}</span>` : ''}</span>
        <span class="ing-amt">${fmtAmount(scaled)}${ing.unit || ''}</span>
      `;
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  }

  container.appendChild(wrap);
}

function renderIngredients() {
  const ul = document.getElementById('ingredients');
  ul.innerHTML = '';
  getActiveIngredients().forEach(ing => {
    const scaled = ing.noScale ? ing.base : ing.base * (servings / currentRecipe.baseServings);
    const li = document.createElement('li');
    li.innerHTML = `
      <span class="ing-name">${ing.name}${ing.tag ? `<span class="ing-tag">${ing.tag}</span>` : ''}</span>
      <span class="ing-amt">${fmtAmount(scaled)}${ing.unit}</span>
    `;
    ul.appendChild(li);
  });
}

function fmtTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function computeDivideWeight() {
  const ings = getActiveIngredients();
  const scale = servings / currentRecipe.baseServings;
  let total = 0;
  ings.forEach(ing => {
    if (ing.excludeFromDivide) return;
    if (ing.unit === 'g' || ing.unit === 'ml') total += ing.base * scale;
  });
  return total;
}

function renderSteps() {
  const container = document.getElementById('steps');
  container.innerHTML = '';
  getActiveSteps().forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.id = `step-${i}`;

    let stepText = step.text;
    if (step.isToppingStep && currentRecipe.toppingOptions) {
      const selected = getSelectedToppingOption();
      if (selected && selected.stepText) stepText = selected.stepText;
    }
    if (step.divideStep && stepText.includes('{{DIVIDE_COUNT}}')) {
      const count = Math.round(servings);
      const perPiece = count > 0 ? computeDivideWeight() / count : 0;
      stepText = stepText
        .replace(/{{DIVIDE_COUNT}}/g, fmtAmount(count))
        .replace(/{{DIVIDE_WEIGHT}}/g, fmtAmount(perPiece));
    }

    let timerHtml = '';
    if (step.timer) {
      timerHtml = `
        <div class="timer-row">
          <button class="timer-btn" data-idx="${i}">타이머 시작</button>
          <span class="timer-display" id="timer-display-${i}">${fmtTime(step.timer)}</span>
        </div>
      `;
    }

    div.innerHTML = `
      <div class="step-check" data-idx="${i}">✓</div>
      <div class="step-body">
        <div class="step-title">${i+1}. ${step.title}</div>
        <div class="step-text">${stepText}</div>
        ${timerHtml}
      </div>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('.step-check').forEach(el => {
    el.addEventListener('click', () => {
      const stepEl = document.getElementById(`step-${el.dataset.idx}`);
      stepEl.classList.toggle('done');
    });
  });

  container.querySelectorAll('.timer-btn').forEach(btn => {
    const idx = btn.dataset.idx;
    btn.addEventListener('click', () => toggleTimer(idx, btn));
  });
}

let alarmAudio = null;
function playBeep() {
  try {
    if (!alarmAudio) alarmAudio = new Audio('alarm.wav');
    alarmAudio.currentTime = 0;
    alarmAudio.play().catch(e => console.error('알람 재생 실패', e));
  } catch (e) {
    console.error('알람 재생 실패', e);
  }
}

function openNativeTimer(seconds, message) {
  // 안드로이드 전용: 시계 앱의 '타이머'를 지정된 길이로 미리 채워서 열어줌
  // (ACTION_SET_TIMER는 표준 안드로이드 인텐트, 대부분의 기본 시계 앱이 지원)
  const isAndroid = /Android/i.test(navigator.userAgent);
  if (!isAndroid) return;

  const seconds_ = Math.max(1, Math.round(seconds));
  const msg = encodeURIComponent(message);

  // fallback URL을 일부러 넣지 않음: 지원 안 되는 기기에서 실패해도
  // 현재 페이지가 새로고침/리셋되지 않고 그냥 아무 일도 안 일어남
  const intentUri =
    `intent://#Intent;` +
    `action=android.intent.action.SET_TIMER;` +
    `category=android.intent.category.DEFAULT;` +
    `i.android.intent.extra.alarm.LENGTH=${seconds_};` +
    `S.android.intent.extra.alarm.MESSAGE=${msg};` +
    `end`;

  const a = document.createElement('a');
  a.href = intentUri;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 500);
}

function toIcsDate(date) {
  return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
}

function icsEscape(str) {
  return String(str).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
}

function downloadStepReminder(idx, secondsFromNow) {
  const step = getActiveSteps()[idx];
  if (!step || !step.timer) return;

  const now = new Date();
  const end = new Date(now.getTime() + secondsFromNow * 1000);
  const uid = `levain-${currentRecipe.id}-${idx}-${now.getTime()}@levain-baking`;

  const title = `${currentRecipe.name} · ${step.title} 완료`;
  const desc = icsEscape(step.text.replace(/<[^>]+>/g, ''));

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//levain-baking//KO',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${toIcsDate(now)}`,
    `DTSTART:${toIcsDate(end)}`,
    `DTEND:${toIcsDate(new Date(end.getTime() + 5 * 60000))}`,
    `SUMMARY:${icsEscape(title)}`,
    `DESCRIPTION:${desc}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:REMINDER',
    'TRIGGER:PT0M',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentRecipe.id}-step${Number(idx) + 1}-reminder.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toggleTimer(idx, btn) {
  const key = currentRecipe.id + '-' + idx;
  const display = document.getElementById(`timer-display-${idx}`);

  if (timerStates[key] && timerStates[key].interval) {
    // 일시정지: 실제 남은 시간을 endTime 기준으로 다시 계산해서 고정
    clearInterval(timerStates[key].interval);
    timerStates[key].interval = null;
    timerStates[key].remaining = Math.max(0, Math.round((timerStates[key].endTime - Date.now()) / 1000));
    btn.classList.remove('running');
    btn.textContent = '타이머 시작';
    return;
  }

  if (!timerStates[key]) {
    timerStates[key] = { remaining: getActiveSteps()[idx].timer };
  }
  if (timerStates[key].remaining <= 0) {
    timerStates[key].remaining = getActiveSteps()[idx].timer;
  }

  // 오디오는 반드시 사용자 클릭(제스처) 시점에 한 번 준비해둬야 나중에(타이머 종료 시) 자동 재생이 막히지 않아요
  if (!alarmAudio) {
    try { alarmAudio = new Audio('alarm.wav'); } catch (e) {}
  }
  if (alarmAudio) {
    alarmAudio.play().then(() => {
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
    }).catch(() => {});
  }

  // 남은 초 대신 '끝나는 실제 시각'을 저장 → background에서 setInterval이 밀리거나 건너뛰어도
  // 다시 화면을 볼 때 실제 경과 시간 기준으로 정확히 재계산됨
  timerStates[key].endTime = Date.now() + timerStates[key].remaining * 1000;
  btn.classList.add('running');
  btn.textContent = '일시정지';

  // 앱 타이머 시작과 동시에, 폰 기본 시계 앱의 '타이머'도 같은 길이로 열어줌 (안드로이드)
  openNativeTimer(timerStates[key].remaining, `${currentRecipe.name} · ${getActiveSteps()[idx].title}`);

  // 캘린더 앱에도 완료 시각 기준 알림 이벤트(.ics)를 다운로드해줌
  downloadStepReminder(idx, timerStates[key].remaining);

  const stepForMid = getActiveSteps()[idx];
  if (timerStates[key].midFired === undefined || timerStates[key].remaining === stepForMid.timer) {
    timerStates[key].midFired = false;
  } else if (timerStates[key].remaining <= Math.round(stepForMid.timer / 2)) {
    timerStates[key].midFired = true;
  }
  const tick = () => {
    const state = timerStates[key];
    if (!state || !state.interval) return;
    const step = getActiveSteps()[idx];
    const remaining = Math.round((state.endTime - Date.now()) / 1000);
    if (step.timerMidBeep && !state.midFired && remaining <= Math.round(step.timer / 2)) {
      state.midFired = true;
      playBeep();
    }
    if (remaining <= 0) {
      clearInterval(state.interval);
      state.interval = null;
      state.remaining = 0;
      if (display) display.textContent = '완료!';
      btn.classList.remove('running');
      btn.textContent = '다시 시작';
      playBeep();
      return;
    }
    state.remaining = remaining;
    if (display) display.textContent = fmtTime(remaining);
  };

  timerStates[key].interval = setInterval(tick, 1000);
  tick();
}

function renderVisual() {
  const el = document.getElementById('detail-visual');
  const img = getActiveImage();
  if (img) {
    el.innerHTML = `<img src="${img}" alt="${currentRecipe.name}">`;
  } else {
    el.innerHTML = '';
  }
}

/* =========================================================
   이벤트 바인딩
   ========================================================= */
document.getElementById('back-btn').addEventListener('click', closeRecipe);
document.getElementById('minus').addEventListener('click', () => {
  const step = currentRecipe.panServings || 1;
  if (servings - step >= step) { servings -= step; updateServings(); }
});
document.getElementById('plus').addEventListener('click', () => {
  const step = currentRecipe.panServings || 1;
  if (servings + step <= currentRecipe.servingsMax) { servings += step; updateServings(); }
});

function updateServings() {
  document.getElementById('servings-num').textContent = servings;
  document.getElementById('servings-unit-label').textContent = computeUnitLabel(currentRecipe, servings);
  renderIngredients();
  renderToppingSection();
  renderSteps();
}

document.getElementById('recipe-search').addEventListener('input', renderHome);
renderHome();
