<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>르방 베이킹 레시피</title>
<script>
  // 스플래시가 그려지기 전에 테마를 먼저 정해서 색 반짝임을 방지
  (function () {
    var THEME_KEY = 'levain-theme-override';
    var THEME_COLORS = {
      spring: '#E8879E', summer: '#2E9CCA', fall: '#C9AB99', winter: '#4A6FA5',
      newyear: '#C9A227', seollal: '#B5342E', chuseok: '#D6B378',
      halloween: '#D9631B', christmas: '#B4292F',
    };
    // 음력 명절 날짜표 (한국천문연구원 발표 기준). 표에 없는 해는 해당 명절 테마를 건너뜀
    var LUNAR_HOLIDAYS = {
      seollal: { 2024:[2,10], 2025:[1,29], 2026:[2,17], 2027:[2,6], 2028:[1,26], 2029:[2,13], 2030:[2,3], 2031:[1,23] },
      chuseok: { 2024:[9,17], 2025:[10,6], 2026:[9,25], 2027:[9,15], 2028:[10,3], 2029:[9,22], 2030:[9,12], 2031:[10,1] },
    };
    function seasonOf(m) {
      if (m === 3 || m === 4 || m === 5) return 'spring';
      if (m === 6 || m === 7 || m === 8) return 'summer';
      if (m === 9 || m === 10 || m === 11) return 'fall';
      return 'winter';
    }
    function autoTheme() {
      var now = new Date();
      var m = now.getMonth() + 1, d = now.getDate(), y = now.getFullYear();
      if (m === 1 && d === 1) return 'newyear';
      if (m === 10 && d === 31) return 'halloween';
      if (m === 12 && d === 25) return 'christmas';
      var seol = LUNAR_HOLIDAYS.seollal[y];
      if (seol && seol[0] === m && seol[1] === d) return 'seollal';
      var chu = LUNAR_HOLIDAYS.chuseok[y];
      if (chu && chu[0] === m && chu[1] === d) return 'chuseok';
      return seasonOf(m);
    }
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    var mode = saved === 'default' ? 'default' : (THEME_COLORS[saved] ? saved : 'season');
    var theme = mode === 'default' ? 'default' : (mode === 'season' ? autoTheme() : mode);
    if (theme === 'default') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    document.documentElement.dataset.themeColor = THEME_COLORS[theme] || '#8A5A34';
  })();
</script>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-recipes.json">
<meta name="theme-color" content="#8A5A34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFFFF;
    --olive: #171717;
    --olive-dark: #111111;
    --crust: #6B6B6B;
    --crust-dark: #333333;
    --ink: #1A1A1A;
    --oil: #171717;
    --accent: #8A5A34;
    --paper: #FFFFFF;
    --line: rgba(0,0,0,0.12);
  }

  /* =========================================================
     테마 팔레트
     - 상시 테마(월 기준 자동 전환): 봄/여름/가을/겨울
     - 그날만 테마(해당 날짜에만 상시 테마를 덮어씀): 새해/설날/추석/할로윈/크리스마스
     ========================================================= */
  html[data-theme="spring"]    { --accent: #faa3b7; --cream: #fbe6ec; --paper: #FEF3F6; }
  html[data-theme="summer"]    { --accent: #0aa4e6; }
  html[data-theme="fall"]      { --accent: #A8451F; --cream: #C9AB99; --paper: #D9C5B9; --line: rgba(60,35,20,0.18); --fall-bg: #C9AB99; }
  html[data-theme="winter"]    { --accent: #85E5F9; --cream: #F2F7FC; --paper: #eaf8fc; }
  html[data-theme="newyear"]   { --accent: #C9A227; --paper: #eef1f4; --ny-stat-accent: #E67424; }

  /* 새해: 재료 양 + 홈 화면 통계 라벨(피크 타임/완성 레시피/도전 예정)만 전용 주황 강조색 사용
     (버튼/테두리 등 다른 곳의 --accent(금색)는 그대로 둠) */
  html[data-theme="newyear"] .ing-amt,
  html[data-theme="newyear"] .starter-stat .l { color: var(--ny-stat-accent); }

  /* 새해: 카드는 반투명 유리 느낌으로 - 뒤의 일출 그라데이션이 은은하게 비침 */
  html[data-theme="newyear"] .recipe-card,
  html[data-theme="newyear"] .step,
  html[data-theme="newyear"] .leavening-card {
    background: rgba(238,241,244,0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  html[data-theme="seollal"]   { --accent: #B5342E; }
  html[data-theme="chuseok"]   { --accent: #B8860B; }
  html[data-theme="halloween"] { --accent: #D9631B; }
  html[data-theme="christmas"] { --accent: #B4292F; }

  /* 테마가 걸려 있으면 포인트 숫자/화살표도 같이 물듦 */
  html[data-theme] .starter-stat .n,
  html[data-theme] .levain-status-card .l-arrow { color: var(--accent); }

  /* 새해는 통계 숫자(.n)만 전용 주황 강조색으로 덮어씀 (l-arrow는 원래 금색 accent 유지) */
  html[data-theme="newyear"] .starter-stat .n { color: var(--ny-stat-accent); }

  html[data-theme="spring"] #splash-screen { background: #FBE6EC; }
  html[data-theme="spring"] .site-hero {
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(232,135,158,0.10), transparent),
      radial-gradient(ellipse 50% 35% at 85% 10%, rgba(140,190,120,0.08), transparent),
      var(--cream);
  }

  /* 봄: 카드/검색창은 --paper(더 연한 분홍), 회색이던 박스도 같은 연분홍으로, 상세 히어로는 배경색과 맞춤 */
  /* 배경은 위 공통 규칙(color-mix)이 --paper 기준으로 자동 처리 */
  html[data-theme="spring"] .note { background: #FEF3F6; }
  html[data-theme="spring"] .hero {
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(232,135,158,0.10), transparent),
      var(--cream);
  }

  /* 봄: 재료 양, 홈 화면 통계(피크 타임/완성 레시피/도전 예정) 글자색 */
  html[data-theme="spring"] .ing-amt,
  html[data-theme="spring"] .starter-stat .n,
  html[data-theme="spring"] .starter-stat .l { color: #E12870; }

  /* 여름: 위 2/3는 하늘색, 아래 1/3은 열기 느낌의 붉은색 그라데이션 (페이지 전체 길이에 맞춰 스크롤과 함께 움직임) */
  html[data-theme="summer"] {
    --summer-sky: linear-gradient(180deg, #BFE6FB 0%, #DDF0FB 55%, #FBE1D7 67%, #F8CBBE 82%, #F4BFB0 100%);
  }
  html[data-theme="summer"] #splash-screen { background: var(--summer-sky); }
  html[data-theme="summer"] body {
    background: var(--summer-sky);
    min-height: 100vh;
  }
  /* 히어로는 투명하게 두어 그라데이션이 그대로 보이게 */
  html[data-theme="summer"] .site-hero,
  html[data-theme="summer"] .hero {
    background: transparent;
  }

  /* 여름: 재료 양, 홈 화면 통계(피크 타임/완성 레시피/도전 예정) 글자색 */
  html[data-theme="summer"] .ing-amt,
  html[data-theme="summer"] .starter-stat .n,
  html[data-theme="summer"] .starter-stat .l { color: #2582FA; }

  /* 가을: 전체를 포근한 밤색 단색으로 깔고, 카드/입력창은 한 톤 밝은 베이지로 띄움. 낙엽이 떨어지는 효과 */
  html[data-theme="fall"] #splash-screen { background: var(--fall-bg); }
  html[data-theme="fall"] body {
    background: var(--fall-bg);
    min-height: 100vh;
  }
  html[data-theme="fall"] .site-hero,
  html[data-theme="fall"] .hero {
    background: transparent;
  }

  /* 밤색 배경 위에 얹히는 글자들은 회색 대신 진한 고동색으로 (대비 확보) */
  html[data-theme="fall"] .site-hero p,
  html[data-theme="fall"] .hero p.desc,
  html[data-theme="fall"] .theme-switcher label,
  html[data-theme="fall"] footer.site-footer,
  html[data-theme="fall"] footer.recipe-footer { color: #4A2E1F; }

  /* 피크 타임/완성 레시피/도전 예정 + 재료 양은 한 세트로 같은 색 */
  html[data-theme="fall"] .ing-amt,
  html[data-theme="fall"] .starter-stat .n,
  html[data-theme="fall"] .starter-stat .l { color: #4A2E1F; }

  /* 카드·노트류도 회색 대신 밤색과 어울리는 톤으로 */
  html[data-theme="fall"] .levain-status-card { color: #3D2619; }
  html[data-theme="fall"] .note { background: #D9C5B9; color: #3D2619; }
  html[data-theme="fall"] .recipe-icon { background: rgba(74,33,19,0.09); }
  html[data-theme="fall"] #splash-screen .splash-dot { background: #F7EDE5; }

  #leaf-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1; /* 모든 텍스트/카드 뒤로 (배경 위, 콘텐츠 아래) */
  }
  #leaf-layer .leaf {
    position: absolute;
    top: 0;
    will-change: transform;
    animation: leaf-fall var(--dur) linear var(--delay) infinite;
  }
  #leaf-layer .leaf svg {
    display: block;
    animation: leaf-sway var(--sway) ease-in-out var(--delay) infinite alternate;
  }
  @keyframes leaf-fall {
    from { transform: translate3d(0, -12vh, 0); }
    to   { transform: translate3d(var(--drift), 112vh, 0); }
  }
  @keyframes leaf-sway {
    from { transform: translateX(-24px) rotate(-45deg); }
    to   { transform: translateX(24px) rotate(55deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #leaf-layer { display: none; }
  }

  html[data-theme="winter"] #splash-screen { background: #F2F7FC; }
  html[data-theme="winter"] .site-hero {
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(133,229,249,0.18), transparent),
      radial-gradient(ellipse 50% 35% at 85% 10%, rgba(180,190,200,0.10), transparent),
      var(--cream);
  }

  /* 겨울: 카드/검색창/노트는 옅은 하늘색(--paper)으로 자동 처리됨 */
  html[data-theme="winter"] .note { background: #eaf8fc; }
  html[data-theme="winter"] .hero {
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(133,229,249,0.18), transparent),
      var(--cream);
  }

  /* 겨울: 앙상한 나뭇가지 같은 진한 고동색 - 피크 타임/완성 레시피/도전 예정 + 재료 양 */
  html[data-theme="winter"] .ing-amt,
  html[data-theme="winter"] .starter-stat .n,
  html[data-theme="winter"] .starter-stat .l { color: #410900; }

  /* 새해: 해가 뒤에서 떠오르며 밤바다색 → 일출색(주황/노랑)으로 배경이 반복 전환되는 애니메이션.
     실제 레이어(#sunrise-layer)는 JS(updateNewyearSunrise)가 테마가 newyear일 때만 body에 붙임 */
  html[data-theme="newyear"] {
    --newyear-sky-night: linear-gradient(180deg, #16213E 0%, #1F3A63 30%, #2E5A8C 55%, #4A7DA8 75%, #6FA3C4 100%);
    --newyear-sky-day: linear-gradient(180deg, #FF9A56 0%, #FFC583 20%, #FFE7B0 40%, #FFF6E0 60%, #FFE9C2 80%, #FFD9A0 100%);
    /* 해가 떠오르는 최고점(top 기준). JS(updateNewyearSunPeak)가 타이틀(h1) 위치에 맞춰 갱신함 */
    --ny-sun-peak-top: 10vh;
  }
  html[data-theme="newyear"] #splash-screen { background: var(--newyear-sky-night); }
  html[data-theme="newyear"] body {
    /* 애니메이션 레이어가 붙기 전/실패 시를 대비한 고정 배경(밤바다색) */
    background: var(--newyear-sky-night);
    min-height: 100vh;
  }
  html[data-theme="newyear"] .topbar { background: transparent; }
  html[data-theme="newyear"] .site-hero,
  html[data-theme="newyear"] .hero {
    background: transparent;
  }

  #sunrise-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1; /* 배경 위, 콘텐츠 아래 (낙엽 레이어와 같은 방식) */
  }
  #sunrise-layer .ny-sky-night,
  #sunrise-layer .ny-sky-day {
    position: absolute;
    inset: 0;
  }
  #sunrise-layer .ny-sky-night { background: var(--newyear-sky-night); }
  #sunrise-layer .ny-sky-day {
    background: var(--newyear-sky-day);
    opacity: 0;
    animation: ny-sky-fade 3.2s ease-out forwards;
  }
  #sunrise-layer .ny-sun {
    position: absolute;
    left: 50%;
    width: 33.34vw;
    height: 33.34vw;
    border-radius: 50%;
    /* 가장자리로 갈수록 알파값이 0에 가까워지도록 색 구간을 늘려서, 딱 잘린 원이 아니라
       은은하게 번지듯 사라지는 느낌 */
    background: radial-gradient(circle closest-side,
      #FFF3D2 0%,
      #FFD98A 22%,
      #FF9E4A 42%,
      rgba(255,158,74,0.55) 62%,
      rgba(255,158,74,0.22) 82%,
      rgba(255,158,74,0) 100%);
    transform: translateX(-50%);
    animation: ny-sun-rise 3.2s ease-out forwards;
  }
  @keyframes ny-sky-fade {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes ny-sun-rise {
    /* 화면 맨 아래(뷰포트 바깥)에서 시작해 타이틀 위치(--ny-sun-peak-top)까지 한 번 떠오른 뒤 그 자리에 고정 */
    0%   { top: 115%; opacity: 0; }
    100% { top: var(--ny-sun-peak-top); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sunrise-layer .ny-sky-day,
    #sunrise-layer .ny-sun { animation: none; }
    #sunrise-layer .ny-sky-day { opacity: 0.55; }
    #sunrise-layer .ny-sun { top: var(--ny-sun-peak-top); opacity: 0.9; }
  }

  html[data-theme="seollal"] #splash-screen { background: #FBEDE7; }
  html[data-theme="seollal"] .site-hero {
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(181,52,46,0.09), transparent),
      radial-gradient(ellipse 50% 35% at 85% 10%, rgba(40,60,110,0.07), transparent),
      var(--paper);
  }

  /* 설날: 메인 카드 오방색 순환 (청 → 다홍 → 황 → 백(한지) → 자)
     - 색은 JS가 카드 순서대로 obang-0~4 클래스를 붙여서 정해짐 (검색 필터링해도 항상 청부터 시작)
     - '준비 중' 카드는 .disabled의 opacity로 구분됨 */
  html[data-theme="seollal"] .recipe-card.obang-0 { background: #DDE9F7; border-color: rgba(60,100,150,0.30); }
  html[data-theme="seollal"] .recipe-card.obang-1 { background: #FBD9D1; border-color: rgba(181,52,46,0.30); }
  html[data-theme="seollal"] .recipe-card.obang-2 { background: #FAECB9; border-color: rgba(160,120,20,0.32); }
  html[data-theme="seollal"] .recipe-card.obang-3 { background: #FBF8EF; border-color: rgba(120,100,60,0.32); }
  html[data-theme="seollal"] .recipe-card.obang-4 { background: #E7DCF2; border-color: rgba(100,70,150,0.30); }
  html[data-theme="seollal"] .recipe-card[class*="obang-"]:not(.disabled):hover { border-color: var(--olive); }
  html[data-theme="seollal"] .recipe-card[class*="obang-"] .recipe-icon { background: rgba(255,255,255,0.55); }

  /* 추석: 아이보리 배경 위로 사과·배·감이 떨어져 맨 아래 제사상에 쌓이는 테마 */
  html[data-theme="chuseok"] {
    --paper: #FFF9EC;
    --cream: #FFF6E4;
  }
  html[data-theme="chuseok"] #splash-screen { background: #FFF6E4; }
  html[data-theme="chuseok"] #splash-screen .splash-dot { background: #E8B33D; }
  html[data-theme="chuseok"] body { background: #FFF6E4; }
  html[data-theme="chuseok"] .topbar { background: #FFF6E4; }
  html[data-theme="chuseok"] .site-hero,
  html[data-theme="chuseok"] .hero {
    background: transparent;
  }
  html[data-theme="chuseok"] .ing-amt,
  html[data-theme="chuseok"] .starter-stat .n,
  html[data-theme="chuseok"] .starter-stat .l { color: #B5482E; }
  html[data-theme="chuseok"] .recipe-card,
  html[data-theme="chuseok"] .step,
  html[data-theme="chuseok"] .leavening-card { background: rgba(255,255,255,0.8); }

  /* 추석 낙과 효과: 과일이 떨어지는 지점(화면 맨 위)은 항상 고정 - 화면 전체를 덮는 고정 오버레이 */
  #jesa-fruit-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    display: none;
    pointer-events: none;
    z-index: -1; /* 낙엽 레이어(#leaf-layer)와 같은 방식 - 모든 콘텐츠 뒤, 배경 위 */
  }
  html[data-theme="chuseok"] #jesa-fruit-layer { display: block; }
  #jesa-fruit-layer .jesa-fruits {
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  /* 제사상: 상 그림 대신 페이지 맨 아래(일반 콘텐츠 흐름)에 놓인 색 블록(상판을 확대한 느낌) - 스크롤을 끝까지 내려야 보임 */
  #jesa-table-scene {
    position: relative;
    width: 100%;
    height: 18vh;
    min-height: 120px;
    background: #881210;
    z-index: -2; /* 낙과 레이어(z-index:-1)보다 뒤에 깔려야 과일이 상 위에 쌓인 것처럼 보임 */
    display: none;
    pointer-events: none;
  }
  html[data-theme="chuseok"] #jesa-table-scene { display: block; }
  .jesa-fruit {
    position: absolute;
    top: -72px;
    width: 52px;
    height: 52px;
    animation: jesa-fall linear forwards;
  }
  .jesa-fruit-inner {
    width: 100%;
    height: 100%;
    animation: jesa-spin 1.5s linear infinite;
  }
  .jesa-fruit-inner svg { display: block; width: 100%; height: 100%; }
  .jesa-fruit.jesa-landed { animation-play-state: paused; }
  .jesa-fruit.jesa-landed .jesa-fruit-inner { animation-play-state: paused; }
  .jesa-fruit.jesa-fade { opacity: 0; transition: opacity 1.1s ease; }
  @keyframes jesa-fall {
    from { transform: translateY(0); }
    to   { transform: translateY(var(--dist)); }
  }
  @keyframes jesa-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 할로윈: 주황 배경 전체 위에 검보라색 실루엣(거미줄/박쥐/잭오랜턴/해골)을 화면 모서리에 고정 배치 */
  html[data-theme="halloween"] {
    --hw-bg: #E8720C;
    --hw-ink: #241531;
  }
  html[data-theme="halloween"] #splash-screen { background: #2B1B3D; }
  html[data-theme="halloween"] body {
    background: var(--hw-bg);
    min-height: 100vh;
  }
  html[data-theme="halloween"] .topbar,
  html[data-theme="halloween"] .site-hero,
  html[data-theme="halloween"] .hero {
    background: transparent;
  }

  /* 주황 배경 위 대비 확보: 회색 글자 대신 검보라색으로 */
  html[data-theme="halloween"] .site-hero p,
  html[data-theme="halloween"] .hero p.desc,
  html[data-theme="halloween"] .theme-switcher label,
  html[data-theme="halloween"] footer.site-footer,
  html[data-theme="halloween"] footer.recipe-footer { color: var(--hw-ink); }

  html[data-theme="halloween"] .ing-amt,
  html[data-theme="halloween"] .starter-stat .n,
  html[data-theme="halloween"] .starter-stat .l { color: var(--hw-ink); }

  html[data-theme="halloween"] .levain-status-card { color: var(--hw-ink); }
  html[data-theme="halloween"] .note { background: #F6B27A; color: var(--hw-ink); }
  html[data-theme="halloween"] .recipe-card,
  html[data-theme="halloween"] .step,
  html[data-theme="halloween"] .leavening-card { background: rgba(255,255,255,0.88); }

  /* 스크롤에 영향받지 않는 고정 배경 실루엣 레이어 - 좌상단/우상단 거미줄, 상단 중앙 박쥐, 잭오랜턴 두 개, 우하단 유령의 집
     - 아이콘은 mask-image로 그려서 --hw-icon-color 하나만 바꾸면 전체 색이 한 번에 바뀜 */
  html[data-theme="halloween"] { --hw-icon-color: #000000; }
  #halloween-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    display: none;
    pointer-events: none;
    z-index: -1;
  }
  html[data-theme="halloween"] #halloween-layer { display: block; }
  #halloween-layer .hw-icon {
    position: absolute;
    display: block;
    width: 110px;
    height: 110px;
    background-color: var(--hw-icon-color);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }
  #halloween-layer .hw-web-left { top: 0; left: 0; }
  #halloween-layer .hw-web-right { top: 0; right: 0; }
  #halloween-layer .hw-bat { top: 16px; left: 50%; width: 45px; height: 45px; transform: translateX(-50%); }
  #halloween-layer .hw-pumpkin { bottom: 0; left: 0; }
  #halloween-layer .hw-witch-pumpkin { bottom: 0; left: 110px; }
  #halloween-layer .hw-castle { bottom: 0; right: 0; width: 130px; height: 130px; }
  @media (max-width: 480px) {
    #halloween-layer .hw-icon { width: 78px; height: 78px; }
    #halloween-layer .hw-bat { width: 32px; height: 32px; top: 10px; }
    #halloween-layer .hw-witch-pumpkin { left: 78px; }
    #halloween-layer .hw-castle { width: 92px; height: 92px; }
  }

  * { box-sizing: border-box; }

  #splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: #F3E8D8;
    transition: opacity 0.4s ease;
  }
  #splash-screen .splash-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  #splash-screen img {
    width: 88px;
    height: 88px;
    border-radius: 20px;
  }
  #splash-screen .splash-icon-spring,
  #splash-screen .splash-icon-summer,
  #splash-screen .splash-icon-fall,
  #splash-screen .splash-icon-winter ,
  #splash-screen .splash-icon-newyear ,
  #splash-screen .splash-icon-seollal ,
  #splash-screen .splash-icon-halloween { display: none; }
  html[data-theme="spring"] #splash-screen .splash-icon-default,
  html[data-theme="summer"] #splash-screen .splash-icon-default,
  html[data-theme="fall"] #splash-screen .splash-icon-default,
  html[data-theme="winter"] #splash-screen .splash-icon-default ,
  html[data-theme="newyear"] #splash-screen .splash-icon-default ,
  html[data-theme="seollal"] #splash-screen .splash-icon-default ,
  html[data-theme="halloween"] #splash-screen .splash-icon-default { display: none; }
  html[data-theme="spring"] #splash-screen .splash-icon-spring { display: block; border-radius: 0; }
  html[data-theme="summer"] #splash-screen .splash-icon-summer { display: block; border-radius: 0; }
  html[data-theme="fall"] #splash-screen .splash-icon-fall { display: block; border-radius: 0; }
  html[data-theme="winter"] #splash-screen .splash-icon-winter { display: block; border-radius: 0; }
  html[data-theme="newyear"] #splash-screen .splash-icon-newyear { display: block; border-radius: 0; }
  html[data-theme="seollal"] #splash-screen .splash-icon-seollal { display: block; border-radius: 0; }
  html[data-theme="halloween"] #splash-screen .splash-icon-halloween { display: block; border-radius: 0; }
  #splash-screen .splash-dots {
    display: flex;
    gap: 10px;
  }
  #splash-screen .splash-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* 처음 실행: 큰 아이콘이 줄어들고, 점이 뒤이어 순차 등장 */
  #splash-screen.first-launch img {
    animation: iconShrink 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes iconShrink {
    0% { transform: scale(2.1); }
    100% { transform: scale(1); }
  }
  #splash-screen.first-launch .splash-dots {
    opacity: 0;
    animation: dotsReveal 0.3s ease-out 0.45s both;
  }
  @keyframes dotsReveal {
    0% { opacity: 0; transform: translateY(4px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  #splash-screen.first-launch .splash-dot {
    animation: splashDotFade 1.2s ease-in-out infinite;
    animation-delay: 0.45s;
  }
  #splash-screen.first-launch .splash-dot:nth-child(2) { animation-delay: 0.65s; }
  #splash-screen.first-launch .splash-dot:nth-child(3) { animation-delay: 0.85s; }

  /* 새로고침/재방문: 전체가 살짝 커지면서 페이드인 */
  #splash-screen.refresh .splash-content {
    animation: splashIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes splashIn {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }
  #splash-screen.refresh .splash-dot {
    animation: splashDotFade 1.2s ease-in-out infinite;
  }
  #splash-screen.refresh .splash-dot:nth-child(1) { animation-delay: 0s; }
  #splash-screen.refresh .splash-dot:nth-child(2) { animation-delay: 0.2s; }
  #splash-screen.refresh .splash-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes splashDotFade {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }
  #splash-screen.hide {
    opacity: 0;
    pointer-events: none;
  }

     - 화면 상단에 계속 붙어 있고, 본문은 뒤로 가려짐 (불투명)
     - 배경은 페이지 배경(body)과 똑같이 맞춤: 단색 테마는 var(--cream), 그라데이션 테마는 아래에서 개별 처리
     - 가로는 전체 폭으로 깔고, 버튼은 본문 왼쪽 선(720px 컬럼)에 맞춤 */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--cream);

    margin: 0;
    padding: 14px max(20px, calc(50% - 340px));
    display: none;

  .topping-extra-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .topping-extra-list li:last-child { border-bottom: none; }

  .leavening-wrap {
    max-width: 720px;
    margin: 24px auto 0;
    padding: 0 20px;
    box-sizing: border-box;
  }
  .leavening-card {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    background: var(--paper);
  }
  .leavening-label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #999999;
    margin-bottom: 10px;
  }
  .leavening-row {
    display: flex;
    background: rgba(0,0,0,0.045);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .leavening-btn {
    flex: 1;
    font-family: 'Public Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--olive-dark);
    cursor: pointer;
    transition: all .15s ease;
  }
  .leavening-btn.active {
    background: var(--olive);
    color: var(--paper);
  }
  .leavening-note {
    margin-top: 10px;
    font-size: 12.5px;
    color: #888888;
    line-height: 1.5;
  }

  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: opacity .2s ease;
  }
  .step.done { opacity: 0.5; }
  .step-check {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--olive);
    margin-top: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    font-size: 14px;
    transition: all .15s ease;
  }
  .step.done .step-check { background: var(--olive); color: var(--paper); }
  .step-body { flex: 1; }
  .step-title { font-weight: 700; font-size: 15.5px; margin-bottom: 4px; color: var(--olive-dark); }
  .step-text { font-size: 14.5px; line-height: 1.6; color: #333333; }
  .step-text b { color: var(--accent); font-variant-numeric: tabular-nums; }

  .timer-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .timer-btn {
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--crust);
    background: transparent;
    color: var(--crust-dark);
    cursor: pointer;
  }
  .timer-btn:hover { background: rgba(0,0,0,0.05); }
  .timer-display { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--crust-dark); font-weight: 600; }
  .timer-btn.running { background: var(--crust); color: var(--paper); }

  .note {
    margin-top: 44px;
    background: #F5F5F5;
    color: #333333;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 24px;
    font-size: 14.5px;
    line-height: 1.65;
  }
  .note b { color: var(--accent); }

  footer.recipe-footer {
    text-align: center;
    padding: 30px 0 0;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13.5px;
    color: #999999;
  }

  @media (max-width: 480px) {
    .site-hero h1 { font-size: 34px; }
    h1.recipe-title { font-size: 34px; }
  }
</style>
</head>

function isYeastMode() {
  return leaveningMode === 'yeast' && !!(currentRecipe && currentRecipe.yeastVersion);
}
function getActiveCakeVariant() {
  if (!currentRecipe || !currentRecipe.cakeVariants) return null;
  return currentRecipe.cakeVariants.find(v => v.id === selectedCakeVariantId) || currentRecipe.cakeVariants[0];
}
function getActiveIngredients() {
  const variant = getActiveCakeVariant();
  if (variant) return variant.ingredients;
  return isYeastMode() ? currentRecipe.yeastVersion.ingredients : currentRecipe.ingredients;
}
function getActiveSteps() {
  const variant = getActiveCakeVariant();
  if (variant) return variant.steps;
  return isYeastMode() ? currentRecipe.yeastVersion.steps : currentRecipe.steps;
}
function getActiveNote() {
  const variant = getActiveCakeVariant();
  if (variant) return variant.note;
  return isYeastMode() ? currentRecipe.yeastVersion.note : currentRecipe.note;
}
function getActiveDesc() {
  const variant = getActiveCakeVariant();
  return variant ? variant.desc : currentRecipe.desc;
}

function fmtElapsedShort(ms) {
  if (ms == null || ms < 0) return '-';
  const totalMin = Math.floor(ms / 60000);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d === 0 && h === 0 && m === 0) return '0h';
  let out = '';
  if (d > 0) out += `${d}d `;
  if (h > 0 || d > 0) out += `${h}h`;
  if (m > 0) out += `${m}m`;
  return out.trim();
}

function renderLevainStatusCard() {
  const valueEl = document.getElementById('levain-status-value');
  const subEl = document.getElementById('levain-status-sub');
  if (!valueEl) return;

  let entries = [];
  try {
    const raw = localStorage.getItem('levain-log-entries');
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) {
    entries = [];
  }

  let lastFeeding = null;
  entries = entries.slice().sort((a, b) => new Date(a.ts) - new Date(b.ts));
  for (let i = entries.length - 1; i >= 0; i--) {
    if (entries[i].isFeeding) { lastFeeding = entries[i]; break; }
  }

  if (!lastFeeding) {
    valueEl.textContent = '기록 없음';
    subEl.textContent = '발효 기록 시작하기';
    return;
  }

  const diff = Date.now() - new Date(lastFeeding.ts).getTime();
  valueEl.textContent = fmtElapsedShort(diff) + ' 경과';
  subEl.textContent = '발효 기록 보러 가기';
}

// 검색어/텍스트 동의어 정규화 (예: 계란 <-> 달걀처럼 표기가 달라도 같은 검색 결과가 나오도록)
const SEARCH_SYNONYMS = [
  ['계란', '달걀'],
];
function normalizeSearchText(text) {
  let result = text;
  SEARCH_SYNONYMS.forEach(([a, b]) => {
    result = result.split(a).join(b);
  });
  return result;
}

// 레시피 하나가 검색어와 매치되는지 확인하고, 어디서 매치됐는지(제목/재료/과정) 반환
function matchRecipe(r, q) {
  q = normalizeSearchText(q);
  const norm = (s) => normalizeSearchText((s || '').toLowerCase());
  if (norm(r.name).includes(q)) return '제목';
  if (norm(r.meta).includes(q) || norm(r.desc).includes(q)) return '제목';
  if ((r.ingredients || []).some(i =>
    norm(i.name).includes(q) ||
    norm(i.tag).includes(q) ||
    String(i.base).includes(q) ||
    `${i.base}${i.unit}`.toLowerCase().includes(q)
  )) return '재료';
  if (r.yeastVersion && (r.yeastVersion.ingredients || []).some(i =>
    norm(i.name).includes(q) ||
    norm(i.tag).includes(q) ||
    String(i.base).includes(q) ||
    `${i.base}${i.unit}`.toLowerCase().includes(q)
  )) return '재료';
  if ((r.steps || []).some(s => norm(s.title).includes(q) || norm(s.text).includes(q))) return '과정';
  if (r.yeastVersion && (r.yeastVersion.steps || []).some(s => norm(s.title).includes(q) || norm(s.text).includes(q))) return '과정';
  if ((r.cakeVariants || []).some(v => norm(v.label).includes(q) || norm(v.desc).includes(q))) return '제목';
  if ((r.cakeVariants || []).some(v => (v.ingredients || []).some(i =>
    norm(i.name).includes(q) ||
    norm(i.tag).includes(q) ||
    String(i.base).includes(q) ||
    `${i.base}${i.unit}`.toLowerCase().includes(q)
  ))) return '재료';
  if ((r.cakeVariants || []).some(v => (v.steps || []).some(s => norm(s.title).includes(q) || norm(s.text).includes(q)))) return '과정';
  if ((r.toppingOptions || []).some(cat =>
    cat.options.some(opt =>
      norm(opt.name).includes(q) ||
      (opt.ingredients || []).some(i =>
        norm(i.name).includes(q) ||
        String(i.base).includes(q) ||
        `${i.base}${i.unit}`.toLowerCase().includes(q)
      )
    )
  )) return '재료';
  return null;
}

function renderHome() {
  renderLevainStatusCard();

  document.getElementById('stat-completed').textContent = RECIPES.length;
  document.getElementById('stat-upcoming').textContent = UPCOMING_RECIPES.length;

  const grid = document.getElementById('recipe-grid');
  const searchInput = document.getElementById('recipe-search');
  const q = (searchInput.value || '').trim().toLowerCase();
  grid.innerHTML = '';

  const filteredRecipes = q
    ? RECIPES.map(r => ({ r, hit: matchRecipe(r, q) })).filter(x => x.hit)
    : RECIPES.map(r => ({ r, hit: null }));

  // 설날 오방색용: 레시피 카드 → 준비 중 카드 순서대로 0~4 반복 (필터링 결과 기준)
  let obangIdx = 0;

  filteredRecipes.forEach(({ r, hit }) => {
    const card = document.createElement('div');
    card.className = 'recipe-card obang-' + (obangIdx++ % 5);
    card.innerHTML = `
      <div class="recipe-icon">${r.icon}</div>
      <div class="recipe-info">
        <div class="recipe-name"><span class="cat-dot cat-${r.category}"></span>${r.name}${hit ? `<span class="search-hit-tag">${hit} 일치</span>` : ''}</div>
        <div class="recipe-meta">${r.meta}</div>
      </div>
      <div class="recipe-arrow">→</div>
    `;
    card.addEventListener('click', () => openRecipe(r.id));
    grid.appendChild(card);
  });

  // 준비 중 카드는 이름으로만 검색 대상에 포함 (검색어 없을 때는 항상 표시)
  const filteredUpcoming = q
    ? UPCOMING_RECIPES.filter(u => u.name.toLowerCase().includes(q))
    : UPCOMING_RECIPES;

  filteredUpcoming.forEach(u => {
    const card = document.createElement('div');
    card.className = 'recipe-card disabled obang-' + (obangIdx++ % 5);
    card.innerHTML = `
      <div class="recipe-icon">${u.icon}</div>
      <div class="recipe-info">
        <div class="recipe-name"><span class="cat-dot cat-${u.category}"></span>${u.name}<span class="soon-tag">준비 중</span></div>
        <div class="recipe-meta">레시피 추가 예정</div>
      </div>
    `;
    grid.appendChild(card);
  });

  if (q && filteredRecipes.length === 0 && filteredUpcoming.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.textContent = `"${searchInput.value.trim()}"에 대한 검색 결과가 없어요.`;
    grid.appendChild(empty);
  }
}

function openRecipe(id) {
  currentRecipe = RECIPES.find(r => r.id === id);
  servings = currentRecipe.baseServings;
  leaveningMode = 'levain';

  document.getElementById('home-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('topbar').style.display = 'block';
  window.scrollTo(0, 0);

  selectedCakeVariantId = currentRecipe.cakeVariants ? currentRecipe.cakeVariants[0].id : null;

  document.getElementById('detail-eyebrow').textContent = currentRecipe.icon + '  ' + currentRecipe.name;
  document.getElementById('detail-title').textContent = currentRecipe.name;
  document.getElementById('detail-desc').textContent = getActiveDesc();
  document.getElementById('detail-note').innerHTML = '<b>메모.</b> ' + getActiveNote();
  document.getElementById('servings-unit-label').textContent = computeUnitLabel(currentRecipe, servings);
  document.getElementById('servings-num').textContent = servings;

  selectedToppingCategoryIdx = 0;
  selectedToppingOptionId = null;
  if (currentRecipe.toppingOptions) {
    const firstCat = currentRecipe.toppingOptions[0];
    const def = firstCat.options.find(o => o.default) || firstCat.options[0];
    selectedToppingOptionId = def.id;
  }

  renderLeaveningToggle();
  renderVisual();
  renderCakeVariantSection();
  renderIngredients();
  renderToppingSection();
  renderSteps();
  syncTopbarBg();
}

function closeRecipe() {
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  currentRecipe = null;
  window.scrollTo(0, 0);
}

function fmtAmount(n) {
  return Math.round(n).toString();

function computeUnitLabel(rec, s) {
  if (rec.panServings) {
    const panCount = Math.ceil(s / rec.panServings);
    return `인분 · 팬 ${panCount}개`;
  }
  return rec.servingsUnit;
}

}

    catRow.appendChild(btn);
  });
  wrap.appendChild(catRow);

  // 세부 옵션 행
  const subRow = document.createElement('div');
  subRow.className = 'topping-row';
  const currentCat = currentRecipe.toppingOptions[selectedToppingCategoryIdx];
  currentCat.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'topping-btn sub' + (opt.id === selectedToppingOptionId ? ' active' : '');
    btn.textContent = opt.name;
    btn.addEventListener('click', () => {
      selectedToppingOptionId = opt.id;
      renderToppingSection();
      renderSteps();
    });
    subRow.appendChild(btn);
  });
  wrap.appendChild(subRow);

  // 선택된 토핑의 재료
  const selected = getSelectedToppingOption();
  if (selected && selected.ingredients && selected.ingredients.length) {
    const ul = document.createElement('ul');
    ul.className = 'topping-extra-list';
    selected.ingredients.forEach(ing => {
      const scaled = ing.base * (servings / currentRecipe.baseServings);
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="ing-name">${ing.name}${ing.tag ? `<span class="ing-tag">${ing.tag}</span>` : ''}</span>
        <span class="ing-amt">${fmtAmount(scaled)}${ing.unit || ''}</span>
      `;
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  }

  container.appendChild(wrap);
}

function renderIngredients() {
  const ul = document.getElementById('ingredients');
  ul.innerHTML = '';
  getActiveIngredients().forEach(ing => {
    const scaled = ing.noScale ? ing.base : ing.base * (servings / currentRecipe.baseServings);
    const li = document.createElement('li');
    li.innerHTML = `
      <span class="ing-name">${ing.name}${ing.tag ? `<span class="ing-tag">${ing.tag}</span>` : ''}</span>
      <span class="ing-amt">${fmtAmount(scaled)}${ing.unit}</span>
    `;
    ul.appendChild(li);
  });
}

function fmtTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function computeDivideWeight() {
  const ings = getActiveIngredients();
  const scale = servings / currentRecipe.baseServings;
  let total = 0;
  ings.forEach(ing => {
    if (ing.excludeFromDivide) return;
    if (ing.unit === 'g' || ing.unit === 'ml') total += ing.base * scale;
  });
  return total;
}

function renderSteps() {
  const container = document.getElementById('steps');
  container.innerHTML = '';
  getActiveSteps().forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.id = `step-${i}`;

    let stepText = step.text;
    if (step.isToppingStep && currentRecipe.toppingOptions) {
      const selected = getSelectedToppingOption();
      if (selected && selected.stepText) stepText = selected.stepText;
    }
    if (step.divideStep && stepText.includes('{{DIVIDE_COUNT}}')) {
      const count = Math.round(servings);
      const perPiece = count > 0 ? computeDivideWeight() / count : 0;
      stepText = stepText
        .replace(/{{DIVIDE_COUNT}}/g, fmtAmount(count))
        .replace(/{{DIVIDE_WEIGHT}}/g, fmtAmount(perPiece));
    }

    let timerHtml = '';
    if (step.timer) {
      timerHtml = `
        <div class="timer-row">
          <button class="timer-btn" data-idx="${i}">타이머 시작</button>
          <span class="timer-display" id="timer-display-${i}">${fmtTime(step.timer)}</span>
        </div>
      `;
    }

    div.innerHTML = `
      <div class="step-check" data-idx="${i}">✓</div>
      <div class="step-body">
        <div class="step-title">${i+1}. ${step.title}</div>
        <div class="step-text">${stepText}</div>
        ${timerHtml}
      </div>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('.step-check').forEach(el => {
    el.addEventListener('click', () => {
      const stepEl = document.getElementById(`step-${el.dataset.idx}`);
      stepEl.classList.toggle('done');
    });
  });

  container.querySelectorAll('.timer-btn').forEach(btn => {
    const idx = btn.dataset.idx;
    btn.addEventListener('click', () => toggleTimer(idx, btn));
  });
}

let alarmAudio = null;
function playBeep() {
  try {
    if (!alarmAudio) alarmAudio = new Audio('alarm.wav');
    alarmAudio.currentTime = 0;
    alarmAudio.play().catch(e => console.error('알람 재생 실패', e));
  } catch (e) {
    console.error('알람 재생 실패', e);
  }
}

function openNativeTimer(seconds, message) {
  // 안드로이드 전용: 시계 앱의 '타이머'를 지정된 길이로 미리 채워서 열어줌
  // (ACTION_SET_TIMER는 표준 안드로이드 인텐트, 대부분의 기본 시계 앱이 지원)
  const isAndroid = /Android/i.test(navigator.userAgent);
  if (!isAndroid) return;

  const seconds_ = Math.max(1, Math.round(seconds));
  const msg = encodeURIComponent(message);

  // fallback URL을 일부러 넣지 않음: 지원 안 되는 기기에서 실패해도
  // 현재 페이지가 새로고침/리셋되지 않고 그냥 아무 일도 안 일어남
  const intentUri =
    `intent://#Intent;` +
    `action=android.intent.action.SET_TIMER;` +
    `category=android.intent.category.DEFAULT;` +
    `i.android.intent.extra.alarm.LENGTH=${seconds_};` +
    `S.android.intent.extra.alarm.MESSAGE=${msg};` +
    `end`;

  const a = document.createElement('a');
  a.href = intentUri;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 500);
}

function toIcsDate(date) {
  return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
}

function icsEscape(str) {
  return String(str).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
}

function downloadStepReminder(idx, secondsFromNow) {
  const step = getActiveSteps()[idx];
  if (!step || !step.timer) return;

  const now = new Date();
  const end = new Date(now.getTime() + secondsFromNow * 1000);
  const uid = `levain-${currentRecipe.id}-${idx}-${now.getTime()}@levain-baking`;

  const title = `${currentRecipe.name} · ${step.title} 완료`;
  const desc = icsEscape(step.text.replace(/<[^>]+>/g, ''));

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//levain-baking//KO',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${toIcsDate(now)}`,
    `DTSTART:${toIcsDate(end)}`,
    `DTEND:${toIcsDate(new Date(end.getTime() + 5 * 60000))}`,
    `SUMMARY:${icsEscape(title)}`,
    `DESCRIPTION:${desc}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:REMINDER',
    'TRIGGER:PT0M',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentRecipe.id}-step${Number(idx) + 1}-reminder.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toggleTimer(idx, btn) {
  const key = currentRecipe.id + '-' + idx;
  const display = document.getElementById(`timer-display-${idx}`);

  if (timerStates[key] && timerStates[key].interval) {
    // 일시정지: 실제 남은 시간을 endTime 기준으로 다시 계산해서 고정
    clearInterval(timerStates[key].interval);
    timerStates[key].interval = null;
    timerStates[key].remaining = Math.max(0, Math.round((timerStates[key].endTime - Date.now()) / 1000));
    btn.classList.remove('running');
    btn.textContent = '타이머 시작';
    return;
  }

  if (!timerStates[key]) {
    timerStates[key] = { remaining: getActiveSteps()[idx].timer };
  }
  if (timerStates[key].remaining <= 0) {
    timerStates[key].remaining = getActiveSteps()[idx].timer;
  }

  // 오디오는 반드시 사용자 클릭(제스처) 시점에 한 번 준비해둬야 나중에(타이머 종료 시) 자동 재생이 막히지 않아요
  if (!alarmAudio) {
    try { alarmAudio = new Audio('alarm.wav'); } catch (e) {}
  }
  if (alarmAudio) {
    alarmAudio.play().then(() => {
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
    }).catch(() => {});
  }

  // 남은 초 대신 '끝나는 실제 시각'을 저장 → background에서 setInterval이 밀리거나 건너뛰어도
  // 다시 화면을 볼 때 실제 경과 시간 기준으로 정확히 재계산됨
  timerStates[key].endTime = Date.now() + timerStates[key].remaining * 1000;
  btn.classList.add('running');
  btn.textContent = '일시정지';

  // 앱 타이머 시작과 동시에, 폰 기본 시계 앱의 '타이머'도 같은 길이로 열어줌 (안드로이드)
  openNativeTimer(timerStates[key].remaining, `${currentRecipe.name} · ${getActiveSteps()[idx].title}`);

  // 캘린더 앱에도 완료 시각 기준 알림 이벤트(.ics)를 다운로드해줌
  downloadStepReminder(idx, timerStates[key].remaining);

  const stepForMid = getActiveSteps()[idx];
  if (timerStates[key].midFired === undefined || timerStates[key].remaining === stepForMid.timer) {
    timerStates[key].midFired = false;
  } else if (timerStates[key].remaining <= Math.round(stepForMid.timer / 2)) {
    timerStates[key].midFired = true;
  }
  const tick = () => {
    const state = timerStates[key];
    if (!state || !state.interval) return;
    const step = getActiveSteps()[idx];
    const remaining = Math.round((state.endTime - Date.now()) / 1000);
    if (step.timerMidBeep && !state.midFired && remaining <= Math.round(step.timer / 2)) {
      state.midFired = true;
      playBeep();
    }
    if (remaining <= 0) {
      clearInterval(state.interval);
      state.interval = null;
      state.remaining = 0;
      if (display) display.textContent = '완료!';
      btn.classList.remove('running');
      btn.textContent = '다시 시작';
      playBeep();
      return;
    }
    state.remaining = remaining;
    if (display) display.textContent = fmtTime(remaining);
  };

  timerStates[key].interval = setInterval(tick, 1000);
  tick();
}

const THEME_STORAGE_KEY = 'levain-theme-override';

  spring: '#E8879E', summer: '#2E9CCA', fall: '#C9AB99', winter: '#4A6FA5',

};
// 음력 명절 날짜표 (한국천문연구원 발표 기준). 표에 없는 해는 해당 명절 테마를 건너뛰고 계절 테마로 대체됨
const LUNAR_HOLIDAYS = {
  seollal: { 2024:[2,10], 2025:[1,29], 2026:[2,17], 2027:[2,6], 2028:[1,26], 2029:[2,13], 2030:[2,3], 2031:[1,23] },
  chuseok: { 2024:[9,17], 2025:[10,6], 2026:[9,25], 2027:[9,15], 2028:[10,3], 2029:[9,22], 2030:[9,12], 2031:[10,1] },
};

function seasonOf(month) {
  if (month === 3 || month === 4 || month === 5) return 'spring';
  if (month === 6 || month === 7 || month === 8) return 'summer';
  if (month === 9 || month === 10 || month === 11) return 'fall';
  return 'winter';
}

function autoTheme() {
  const now = new Date();
  const m = now.getMonth() + 1, d = now.getDate(), y = now.getFullYear();
  if (m === 1 && d === 1) return 'newyear';
  if (m === 10 && d === 31) return 'halloween';
  if (m === 12 && d === 25) return 'christmas';
  const seol = LUNAR_HOLIDAYS.seollal[y];
  if (seol && seol[0] === m && seol[1] === d) return 'seollal';
  const chu = LUNAR_HOLIDAYS.chuseok[y];
  if (chu && chu[0] === m && chu[1] === d) return 'chuseok';
  return seasonOf(m);
}

// 해가 떠올랐을 때 멈추는 최고점을 타이틀(h1 "르방 베이킹 레시피") 위치에 맞춰 계산.
// 상세 화면 등 타이틀이 안 보이는 상태면 기본값(10vh)을 씀
function updateNewyearSunPeak() {
  if (document.documentElement.getAttribute('data-theme') !== 'newyear') return;
  const sun = document.querySelector('#sunrise-layer .ny-sun');
  const h1 = document.querySelector('.site-hero h1');
  if (!sun) return;
  const h1Rect = h1 ? h1.getBoundingClientRect() : null;
  if (!h1Rect || (h1Rect.width === 0 && h1Rect.height === 0)) {
    document.documentElement.style.setProperty('--ny-sun-peak-top', '10vh');
    return;
  }
  const sunSize = sun.getBoundingClientRect().height || window.innerWidth * 0.3334;
  const targetTop = Math.max(h1Rect.top + h1Rect.height / 2 - sunSize / 2, 0);
  document.documentElement.style.setProperty('--ny-sun-peak-top', targetTop + 'px');
}
window.addEventListener('resize', updateNewyearSunPeak);

  { svg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#E8B93D"/><path d="M12 5c0-1.2.6-2.1 1.4-2.6" stroke="#7A5A22" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>' },
  // 감: 살짝 납작한 주황 원 + 네잎 꽃받침 모양 꼭지
  { svg: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="13.5" rx="8.4" ry="7.3" fill="#E8742A"/><g fill="#5B7A34"><path d="M12,3.6 C10.9,5.0 10.3,6.2 10.3,7.1 C10.3,8.1 11.1,8.8 12,8.8 C12.9,8.8 13.7,8.1 13.7,7.1 C13.7,6.2 13.1,5.0 12,3.6 Z"/><path d="M12,3.6 C10.9,5.0 10.3,6.2 10.3,7.1 C10.3,8.1 11.1,8.8 12,8.8 C12.9,8.8 13.7,8.1 13.7,7.1 C13.7,6.2 13.1,5.0 12,3.6 Z" transform="rotate(90 12 7)"/><path d="M12,3.6 C10.9,5.0 10.3,6.2 10.3,7.1 C10.3,8.1 11.1,8.8 12,8.8 C12.9,8.8 13.7,8.1 13.7,7.1 C13.7,6.2 13.1,5.0 12,3.6 Z" transform="rotate(180 12 7)"/><path d="M12,3.6 C10.9,5.0 10.3,6.2 10.3,7.1 C10.3,8.1 11.1,8.8 12,8.8 C12.9,8.8 13.7,8.1 13.7,7.1 C13.7,6.2 13.1,5.0 12,3.6 Z" transform="rotate(270 12 7)"/></g><ellipse cx="12" cy="7" rx="1" ry="0.8" fill="#3F5A22"/></svg>' },
];
let jesaPositions = [];
let jesaPosIndex = 0;
let jesaQueue = [];
let jesaTimer = null;

function jesaShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// 랜덤 지점을 한 번에(테마 켤 때) 미리 뽑아 순서대로 소진 - 다음 과일이 항상 다른 자리에 떨어지도록 함
function initJesaPositions() {
  const slots = [10, 22, 34, 46, 58, 70, 82, 92];
  jesaPositions = jesaShuffle(slots);
  jesaPosIndex = 0;
}

function nextJesaPosition() {
  if (jesaPosIndex >= jesaPositions.length) {
    const last = jesaPositions[jesaPositions.length - 1];
    let reshuffled;
    do {
      reshuffled = jesaShuffle(jesaPositions);
    } while (jesaPositions.length > 1 && reshuffled[0] === last);
    jesaPositions = reshuffled;
    jesaPosIndex = 0;
  }
  return jesaPositions[jesaPosIndex++];
}

function spawnJesaFruit() {
  const layer = document.querySelector('#jesa-fruit-layer .jesa-fruits');
  const tableEl = document.getElementById('jesa-table-scene');
  if (!layer || !tableEl) return;
  const tableRect = tableEl.getBoundingClientRect();
  const FRUIT_SIZE = 52;
  const marginX = 20, marginY = 14;
  const usableW = Math.max(tableRect.width - FRUIT_SIZE - marginX * 2, 10);
  const usableH = Math.max(tableRect.height - FRUIT_SIZE - marginY * 2, 10);
  const fruitType = JESA_FRUITS[Math.floor(Math.random() * JESA_FRUITS.length)];
  const fruit = document.createElement('div');
  fruit.className = 'jesa-fruit';
  const leftPct = nextJesaPosition();
  // x좌표: 겹침 방지를 위해 미리 셔플해둔 슬롯 순서대로, 블록 안쪽 여백을 뺀 폭 기준
  const leftPx = tableRect.left + marginX + (leftPct / 100) * usableW;
  fruit.style.left = leftPx + 'px';
  // y좌표: 블록 안에서 완전 랜덤 - 블록은 페이지 맨 아래 일반 콘텐츠라 스크롤을 끝까지 내려야 보임
  const landY = tableRect.top + marginY + Math.random() * usableH;
  // 낙하 시작점(-72px, 화면 맨 위)에서 착지 y좌표까지의 실제 거리
  const dist = Math.max(landY + 72, 120);
  fruit.style.setProperty('--dist', dist + 'px');
  // 항상 같은 체감 속도로 떨어지도록(거리가 멀면 그만큼 오래 걸림)
  const speed = 210 + Math.random() * 60; // px/s
  fruit.style.animationDuration = (dist / speed) + 's';
  const inner = document.createElement('div');
  inner.className = 'jesa-fruit-inner';
  inner.innerHTML = fruitType.svg;
  fruit.appendChild(inner);
  layer.appendChild(fruit);

  fruit.addEventListener('animationend', function handler(e) {
    if (e.animationName !== 'jesa-fall') return;
    fruit.removeEventListener('animationend', handler);
    fruit.classList.add('jesa-landed');

    // 착지 후엔 화면 고정 레이어에서 상(일반 문서 흐름) 쪽으로 옮겨서 스크롤할 때 상과 같이 움직이게 함.
    // 지금 화면에 보이는 자리(leftPx, landY)를 그 시점의 상 기준 상대좌표로 환산하되, 낙하 중 스크롤이 있었다면
    // 상 박스 범위를 벗어날 수 있어서(=페이지가 그만큼 더 길어져버림) 현재 상 범위 안으로 강제로 가둠(clamp)
    const freshTableRect = tableEl.getBoundingClientRect();
    const maxLeft = Math.max(freshTableRect.width - FRUIT_SIZE - marginX, marginX);
    const maxTop = Math.max(freshTableRect.height - FRUIT_SIZE - marginY, marginY);
    const relLeft = Math.min(Math.max(leftPx - freshTableRect.left, marginX), maxLeft);
    const relTop = Math.min(Math.max(landY - freshTableRect.top, marginY), maxTop);
    fruit.style.animation = 'none';
    fruit.style.transform = 'none';
    fruit.style.left = relLeft + 'px';
    fruit.style.top = relTop + 'px';
    tableEl.appendChild(fruit);

    jesaQueue.push(fruit);
    // 떨어진 과일은 그 뒤로 5개(총 6개)가 더 쌓이면 서서히 사라짐
    if (jesaQueue.length > 6) {
      const oldest = jesaQueue.shift();
      oldest.classList.add('jesa-fade');
      setTimeout(() => oldest.remove(), 1200);
    }
  });
}

function updateJesaScene(theme) {
  if (theme !== 'chuseok') {
    if (jesaTimer) { clearInterval(jesaTimer); jesaTimer = null; }
    const layer = document.querySelector('#jesa-fruit-layer .jesa-fruits');
    if (layer) layer.innerHTML = '';
    jesaQueue = [];
    return;
  }
  if (jesaTimer) return;
  initJesaPositions();
  spawnJesaFruit();
  jesaTimer = setInterval(spawnJesaFruit, 1500);
}

function applyTheme(theme) {
  if (theme === 'default') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', THEME_META_COLORS[theme] || '#8A5A34');
  updateFallLeaves(theme);
  updateNewyearSunrise(theme);
  updateJesaScene(theme);
}

const themeSelect = document.getElementById('theme-select');
// mode: 'default' | 'season'(자동) | 개별 테마 이름(spring, halloween 등)
function themeForMode(mode) {
  if (mode === 'default') return 'default';
  if (mode === 'season') return autoTheme();
  return THEME_META_COLORS[mode] ? mode : autoTheme();
}
function normalizeMode(saved) {
  if (saved === 'default') return 'default';
  return THEME_META_COLORS[saved] ? saved : 'season';
}

themeSelect.addEventListener('change', () => {
  const mode = themeSelect.value;
  try { localStorage.setItem(THEME_STORAGE_KEY, mode); } catch (e) {}
  applyTheme(themeForMode(mode));
});

// head의 선제 스크립트가 이미 정해둔 테마를 그대로 이어받아 셀렉트 값만 맞춰줌
let savedMode = 'season';
try { savedMode = normalizeMode(localStorage.getItem(THEME_STORAGE_KEY)); } catch (e) {}
themeSelect.value = savedMode;
applyTheme(savedMode === 'default' ? 'default' : (document.documentElement.getAttribute('data-theme') || themeForMode(savedMode)));
</script>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 400);
      }
    }, 500);
  });
</script>
