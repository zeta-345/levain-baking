<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정보처리기사 퀴즈</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #f5f5f4;
      --bg3: #f1efe8;
      --text: #1a1a18;
      --text2: #5f5e5a;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --green: #1D9E75;
      --green-bg: #EAF3DE;
      --green-text: #27500A;
      --red-bg: #FCEBEB;
      --red-text: #791F1F;
      --red-border: #E24B4A;
      --blue-bg: #E6F1FB;
      --blue-text: #0C447C;
      --blue-border: #185FA5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg2: #2a2a27;
        --bg3: #232321;
        --text: #f0ede6;
        --text2: #a0a09a;
        --border: rgba(255,255,255,0.12);
        --border2: rgba(255,255,255,0.22);
        --green-bg: #173404;
        --green-text: #C0DD97;
        --red-bg: #501313;
        --red-text: #F7C1C1;
        --red-border: #A32D2D;
        --blue-bg: #042C53;
        --blue-text: #B5D4F4;
        --blue-border: #185FA5;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg3);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 1.5rem 0 1rem;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
    }

    header p {
      font-size: 14px;
      color: var(--text2);
      margin-top: 4px;
    }

    .tab-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .tab {
      padding: 8px 14px;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      font-size: 14px;
      cursor: pointer;
      background: transparent;
      color: var(--text2);
      font-family: inherit;
    }

    .tab:hover { background: var(--bg2); }

    .tab.active {
      background: var(--bg2);
      color: var(--text);
      font-weight: 500;
      border-color: var(--border2);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      background: var(--blue-bg);
      color: var(--blue-text);
    }

    .q-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .q-img-wrap {
      text-align: center;
      margin-bottom: 1rem;
    }

    .q-img-wrap img {
      max-width: 100%;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border);
      background: #fff;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: transparent;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .option:hover:not(.disabled) { background: var(--bg2); }
    .option.correct { background: var(--green-bg); border-color: #639922; color: var(--green-text); }
    .option.wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
    .option.disabled { cursor: default; }

    .feedback {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      margin-top: 12px;
      display: none;
      line-height: 1.6;
    }

    .feedback.show { display: block; }
    .feedback.ok { background: var(--green-bg); color: var(--green-text); }
    .feedback.ng { background: var(--red-bg); color: var(--red-text); }

    .btn {
      padding: 10px 20px;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
    }

    .btn:hover { background: var(--bg2); }

    .btn-primary {
      background: var(--blue-bg);
      border-color: var(--blue-border);
      color: var(--blue-text);
      font-weight: 500;
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-danger {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
      font-size: 12px;
      padding: 6px 12px;
    }

    .progress-bar-wrap {
      background: var(--bg2);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 1rem;
    }

    .progress-bar-fill {
      height: 6px;
      border-radius: 99px;
      background: var(--green);
      transition: width 0.3s;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 1.25rem;
    }

    .stat-card {
      background: var(--bg2);
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
    }

    .stat-val { font-size: 24px; font-weight: 500; color: var(--text); }
    .stat-label { font-size: 13px; color: var(--text2); margin-top: 4px; }

    .subject-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--border);
      gap: 12px;
    }

    .mini-bar-wrap { width: 100px; background: var(--bg2); border-radius: 99px; height: 6px; flex-shrink: 0; }
    .mini-bar { height: 6px; border-radius: 99px; background: #378ADD; }
    .pct { font-size: 13px; color: var(--text2); min-width: 36px; text-align: right; }

    .wrong-item { padding: 12px 0; border-bottom: 0.5px solid var(--border); }
    .wrong-q { font-size: 14px; color: var(--text); margin-bottom: 6px; line-height: 1.5; }

    .section-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 1rem; }

    .empty { font-size: 14px; color: var(--text2); padding: 2rem 0; text-align: center; }

    .result-area { text-align: center; padding: 2rem 0; display: none; }
    .result-area.show { display: block; }
    .result-score { font-size: 36px; font-weight: 500; color: var(--text); }
    .result-msg { font-size: 15px; color: var(--text2); margin: 8px 0 1.5rem; }

    /* 문제 추가 폼 */
    .form-group { margin-bottom: 1rem; }

    .form-label { font-size: 13px; color: var(--text2); margin-bottom: 6px; display: block; }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }

    .form-input:focus { outline: none; border-color: var(--blue-border); }

    .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .opt-label { font-size: 12px; color: var(--text2); min-width: 28px; }

    .ans-hint { font-size: 12px; color: var(--text2); margin-top: 4px; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--green);
      color: #fff;
      padding: 10px 24px;
      border-radius: var(--radius-md);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }

    .q-list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--border);
      gap: 12px;
    }

    .q-list-text { font-size: 14px; color: var(--text); flex: 1; line-height: 1.5; }
    .q-list-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }

    .count-badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: var(--radius-md);
      background: #EEEDFE;
      color: #3C3489;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="ti ti-school" aria-hidden="true"></i> 정보처리기사 퀴즈</h1>
      <p>기출문제로 합격을 준비하세요</p>
    </header>

    <div class="tab-bar">
      <button class="tab active" onclick="showTab('quiz')"><i class="ti ti-pencil" aria-hidden="true"></i> 퀴즈</button>
      <button class="tab" onclick="showTab('progress')"><i class="ti ti-chart-bar" aria-hidden="true"></i> 진도</button>
      <button class="tab" onclick="showTab('wrong')"><i class="ti ti-bookmark" aria-hidden="true"></i> 오답노트</button>
      <button class="tab" onclick="showTab('add')"><i class="ti ti-plus" aria-hidden="true"></i> 문제 추가</button>
      <button class="tab" onclick="showTab('manage')"><i class="ti ti-list" aria-hidden="true"></i> 문제 목록</button>
    </div>

    <!-- 퀴즈 -->
    <div class="screen active" id="screen-quiz">
      <div id="quiz-area">
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
        <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;" id="q-counter"></p>
        <div class="card">
          <span class="badge" id="q-subject"></span>
          <p class="q-text" id="q-text"></p>
          <div class="q-img-wrap" id="q-img-wrap"></div>
          <div id="options-area"></div>
          <div class="feedback" id="feedback"></div>
          <button class="btn" id="next-btn" style="margin-top:1rem;display:none;" onclick="nextQ()">다음 문제 →</button>
        </div>
      </div>
      <div class="result-area" id="result-area">
        <p style="font-size:14px;color:var(--text2);margin-bottom:8px;">최종 결과</p>
        <div class="result-score" id="result-score"></div>
        <p class="result-msg" id="result-msg"></p>
        <div class="card" style="text-align:left;margin:1rem 0;">
          <p class="section-title">과목별 결과</p>
          <div id="result-subject-breakdown"></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="startNormalRound()">새로운 20문제 풀기</button>
          <button class="btn" id="goto-wrong-btn" style="display:none;" onclick="startWrongRound()">오답노트 풀기</button>
        </div>
      </div>
    </div>

    <!-- 진도 -->
    <div class="screen" id="screen-progress">
      <p id="progress-mode-label" style="font-size:13px;color:var(--text2);margin-bottom:1rem;"></p>
      <div class="stat-grid" id="stat-grid"></div>
      <div class="card">
        <p class="section-title">과목별 정답률</p>
        <div id="subject-list"></div>
      </div>
    </div>

    <!-- 오답노트 -->
    <div class="screen" id="screen-wrong">
      <button class="btn btn-primary" id="start-wrong-btn" style="width:100%;margin-bottom:1rem;display:none;" onclick="startWrongRound()"></button>
      <div class="card">
        <p class="section-title">틀린 문제 목록 (자동 저장됨)</p>
        <div id="wrong-list"></div>
      </div>
    </div>

    <!-- 문제 추가 -->
    <div class="screen" id="screen-add">
      <div class="card">
        <p class="section-title">새 문제 추가</p>
        <div class="form-group">
          <label class="form-label">과목</label>
          <select class="form-input" id="add-subject">
            <option>소프트웨어 설계</option>
            <option>소프트웨어 개발</option>
            <option>데이터베이스</option>
            <option>프로그래밍 언어</option>
            <option>정보시스템 구축관리</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">문제</label>
          <textarea class="form-input" id="add-q" rows="3" placeholder="문제를 입력하세요"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">보기 (정답 왼쪽 버튼 선택)</label>
          <div id="opt-inputs"></div>
          <p class="ans-hint"><i class="ti ti-info-circle" aria-hidden="true"></i> 정답 보기 왼쪽 라디오 버튼을 클릭하세요</p>
        </div>
        <div class="form-group">
          <label class="form-label">해설 (선택)</label>
          <textarea class="form-input" id="add-exp" rows="2" placeholder="해설을 입력하세요 (선택사항)"></textarea>
        </div>
        <button class="btn btn-primary" onclick="addQuestion()"><i class="ti ti-plus" aria-hidden="true"></i> 문제 추가</button>
      </div>
    </div>

    <!-- 문제 목록 -->
    <div class="screen" id="screen-manage">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
          <p class="section-title" style="margin:0;">전체 문제 <span class="count-badge" id="q-total-badge">0</span></p>
        </div>
        <div id="q-manage-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let questions=[];
    let nextId = 1;
    const SUBJECTS = ['소프트웨어 설계','소프트웨어 개발','데이터베이스','프로그래밍 언어','정보시스템 구축관리'];
    const PER_SUBJECT = 4; // 과목당 문제 수
    const WRONG_ROUND_SIZE = 20; // 오답노트 한 회차 문제 수
    const WRONG_REMOVE_STREAK = 3; // 오답노트에서 연속 정답 시 제거 기준
    const NORMAL_EXCLUDE_STREAK = 5; // 랜덤에서 연속 정답 시 제외 기준
    const NORMAL_EXCLUDE_ROUNDS = 3; // 제외되는 회차 수

    // ---------- 영속 데이터 (localStorage) ----------
    function loadJSON(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch (e) { return fallback; }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    let normalStats = loadJSON('qz_normalStats', {});   // { qid: {streak, excludeUntil} }
    let wrongStats  = loadJSON('qz_wrongStats', {});    // { qid: {streak} }
    let wrongList   = loadJSON('qz_wrongList', []);     // [qid, ...]
    let roundNum    = loadJSON('qz_round', 0);

    function persistAll() {
      saveJSON('qz_normalStats', normalStats);
      saveJSON('qz_wrongStats', wrongStats);
      saveJSON('qz_wrongList', wrongList);
      saveJSON('qz_round', roundNum);
    }

    function getNormalStat(id) {
      if (!normalStats[id]) normalStats[id] = { streak: 0, excludeUntil: 0 };
      return normalStats[id];
    }
    function getWrongStat(id) {
      if (!wrongStats[id]) wrongStats[id] = { streak: 0 };
      return wrongStats[id];
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function findQuestion(id) {
      return questions.find(q => q.id === id);
    }

    // ---------- 문제 선정 ----------
    function pickNormalQuestions() {
      let picked = [];
      SUBJECTS.forEach(subj => {
        const pool = questions.filter(q => q.subject === subj);
        const available = [];
        const excluded = [];
        pool.forEach(q => {
          const st = getNormalStat(q.id);
          if (st.excludeUntil && st.excludeUntil > roundNum) excluded.push(q);
          else available.push(q);
        });
        let chosen = shuffle(available).slice(0, PER_SUBJECT);
        if (chosen.length < PER_SUBJECT) {
          const need = PER_SUBJECT - chosen.length;
          const fill = shuffle(excluded).slice(0, need);
          chosen = chosen.concat(fill);
        }
        picked = picked.concat(chosen);
      });
      // 과목이 뒤섞이도록 전체 셔플
      return shuffle(picked);
    }

    function pickWrongQuestions() {
      const pool = wrongList.map(id => findQuestion(id)).filter(Boolean);
      return shuffle(pool).slice(0, WRONG_ROUND_SIZE);
    }

    // ---------- 상태 ----------
    let state = {
      mode: 'normal',       // 'normal' | 'wrong'
      quizQuestions: [],
      cur: 0,
      answered: false,
      score: 0,
      subjectStats: {},
      roundWrongList: []
    };

    function initSubjectStats(list) {
      state.subjectStats = {};
      list.forEach(q => {
        if (!state.subjectStats[q.subject]) state.subjectStats[q.subject] = { total: 0, correct: 0 };
        state.subjectStats[q.subject].total++;
      });
    }

    function startNormalRound() {
      roundNum++;
      persistAll();
      state.mode = 'normal';
      state.quizQuestions = pickNormalQuestions();
      state.cur = 0;
      state.score = 0;
      state.roundWrongList = [];
      initSubjectStats(state.quizQuestions);
      document.getElementById('quiz-area').style.display = '';
      document.getElementById('result-area').className = 'result-area';
      showTab('quiz');
      renderQ();
    }

    function startWrongRound() {
      const list = pickWrongQuestions();
      if (list.length === 0) {
        showToast('오답노트에 문제가 없습니다!', true);
        return;
      }
      state.mode = 'wrong';
      state.quizQuestions = list;
      state.cur = 0;
      state.score = 0;
      state.roundWrongList = [];
      initSubjectStats(state.quizQuestions);
      document.getElementById('quiz-area').style.display = '';
      document.getElementById('result-area').className = 'result-area';
      showTab('quiz');
      renderQ();
    }

    function renderOptInputs() {
      selectedAns = -1;
      const area = document.getElementById('opt-inputs');
      area.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const row = document.createElement('div');
        row.className = 'opt-row';
        row.innerHTML = `<input type="radio" name="ans-radio" style="width:18px;height:18px;cursor:pointer;flex-shrink:0;" value="${i}" id="radio-${i}"><label class="opt-label" for="radio-${i}">${i+1}번</label><input class="form-input" id="opt-${i}" placeholder="보기 ${i+1}" style="flex:1;">`;
        row.querySelector('input[type=radio]').addEventListener('change', () => { selectedAns = i; });
        area.appendChild(row);
      }
    }
    renderOptInputs();

    function addQuestion() {
      const subj = document.getElementById('add-subject').value;
      const qtext = document.getElementById('add-q').value.trim();
      const opts = [0,1,2,3].map(i => document.getElementById('opt-'+i).value.trim());
      const exp = document.getElementById('add-exp').value.trim();
      if (!qtext) { showToast('문제를 입력해주세요', true); return; }
      if (opts.some(o => !o)) { showToast('보기를 모두 입력해주세요', true); return; }
      if (selectedAns === -1) { showToast('정답을 선택해주세요', true); return; }
      questions.push({ id:nextId++, subject:subj, q:qtext, opts, ans:selectedAns, exp });
      document.getElementById('add-q').value = '';
      document.getElementById('add-exp').value = '';
      renderOptInputs();
      showToast('문제가 추가되었습니다! 총 ' + questions.length + '문제');
    }

    function deleteQuestion(id) {
      const idx = questions.findIndex(q => q.id === id);
      if (idx === -1) return;
      questions.splice(idx, 1);
      delete normalStats[id];
      delete wrongStats[id];
      wrongList = wrongList.filter(w => w !== id);
      persistAll();
      renderManage();
      showToast('문제가 삭제되었습니다');
    }

    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isErr ? '#E24B4A' : '#1D9E75';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function showTab(name) {
      const names = ['quiz','progress','wrong','add','manage'];
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', names[i] === name));
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-'+name).classList.add('active');
      if (name === 'progress') renderProgress();
      if (name === 'wrong') renderWrong();
      if (name === 'manage') renderManage();
    }

    function renderQ() {
      const list = state.quizQuestions;
      if (list.length === 0) {
        document.getElementById('q-text').textContent = '문제가 없습니다.';
        document.getElementById('options-area').innerHTML = '';
        document.getElementById('q-subject').textContent = '';
        return;
      }
      const q = list[state.cur];
      document.getElementById('prog-fill').style.width = (state.cur / list.length * 100) + '%';
      const modeLabel = state.mode === 'wrong' ? '오답노트 모드' : '랜덤 모드';
      document.getElementById('q-counter').textContent = modeLabel + ' · 문제 ' + (state.cur+1) + ' / ' + list.length;
      document.getElementById('q-subject').textContent = q.subject;
      document.getElementById('q-text').textContent = q.q;
      const imgWrap = document.getElementById('q-img-wrap');
      if (q.img) {
        imgWrap.innerHTML = '<img src="' + q.img + '" alt="문제 그림">';
        imgWrap.style.display = '';
      } else {
        imgWrap.innerHTML = '';
        imgWrap.style.display = 'none';
      }
      const area = document.getElementById('options-area');
      area.innerHTML = '';
      q.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = (i+1) + '. ' + opt;
        btn.onclick = () => selectOpt(i);
        area.appendChild(btn);
      });
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('next-btn').style.display = 'none';
      state.answered = false;
    }

    function selectOpt(idx) {
      if (state.answered) return;
      state.answered = true;
      const q = state.quizQuestions[state.cur];
      const btns = document.querySelectorAll('.option');
      btns.forEach(b => b.classList.add('disabled'));
      const fb = document.getElementById('feedback');
      const isCorrect = idx === q.ans;

      if (isCorrect) {
        btns[idx].classList.add('correct');
        fb.className = 'feedback ok show';
        fb.textContent = '정답입니다! ' + (q.exp || '');
        state.score++;
        if (state.subjectStats[q.subject]) state.subjectStats[q.subject].correct = (state.subjectStats[q.subject].correct||0)+1;
      } else {
        btns[idx].classList.add('wrong');
        btns[q.ans].classList.add('correct');
        fb.className = 'feedback ng show';
        fb.textContent = '오답입니다. ' + (q.exp || '');
        state.roundWrongList.push({ q:q.q, myAns:q.opts[idx], rightAns:q.opts[q.ans] });
      }

      if (state.mode === 'normal') {
        const st = getNormalStat(q.id);
        if (isCorrect) {
          st.streak = (st.streak||0) + 1;
          if (st.streak >= NORMAL_EXCLUDE_STREAK) {
            st.excludeUntil = roundNum + NORMAL_EXCLUDE_ROUNDS;
            st.streak = 0;
          }
        } else {
          st.streak = 0;
          st.excludeUntil = 0;
          if (!wrongList.includes(q.id)) wrongList.push(q.id);
          wrongStats[q.id] = { streak: 0 };
        }
      } else { // wrong mode
        const wst = getWrongStat(q.id);
        if (isCorrect) {
          wst.streak = (wst.streak||0) + 1;
          if (wst.streak >= WRONG_REMOVE_STREAK) {
            wrongList = wrongList.filter(id => id !== q.id);
            delete wrongStats[q.id];
            showToast('"' + q.q.slice(0,20) + '..." 3연속 정답! 오답노트에서 제거됨');
          }
        } else {
          wst.streak = 0;
        }
      }
      persistAll();

      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQ() {
      state.cur++;
      if (state.cur >= state.quizQuestions.length) {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').className = 'result-area show';
        const total = state.quizQuestions.length;
        const pct = total ? Math.round(state.score / total * 100) : 0;
        document.getElementById('result-score').textContent = state.score + ' / ' + total + '문제 정답';
        const modeMsg = state.mode === 'wrong' ? '오답노트 회차 결과입니다.' : '랜덤 회차 결과입니다.';
        document.getElementById('result-msg').textContent = modeMsg + ' ' + (pct >= 60 ? '합격권입니다! 계속 유지하세요 🎉' : '오답노트를 확인하고 다시 도전해보세요.');

        // 과목별 점수
        const sb = document.getElementById('result-subject-breakdown');
        sb.innerHTML = '';
        Object.entries(state.subjectStats).forEach(([name, s]) => {
          const p = s.total > 0 ? Math.round((s.correct||0)/s.total*100) : 0;
          sb.innerHTML += '<div class="subject-row"><span style="font-size:14px;color:var(--text);flex:1;">'+name+'</span><span style="font-size:13px;color:var(--text2);margin-right:8px;">'+(s.correct||0)+'/'+s.total+'</span><div class="mini-bar-wrap"><div class="mini-bar" style="width:'+p+'%"></div></div><span class="pct">'+p+'%</span></div>';
        });

        // 오답노트 풀기 버튼 표시 여부
        const wrongBtn = document.getElementById('goto-wrong-btn');
        if (wrongList.length > 0) {
          wrongBtn.style.display = '';
          wrongBtn.textContent = '오답노트 풀기 (' + wrongList.length + '문제)';
        } else {
          wrongBtn.style.display = 'none';
        }
      } else {
        renderQ();
      }
    }

    function renderProgress() {
      const total = state.quizQuestions.length;
      document.getElementById('stat-grid').innerHTML =
        '<div class="stat-card"><div class="stat-val">'+state.cur+'</div><div class="stat-label">푼 문제</div></div>'+
        '<div class="stat-card"><div class="stat-val">'+state.score+'</div><div class="stat-label">정답 수</div></div>'+
        '<div class="stat-card"><div class="stat-val">'+(state.cur>0?Math.round(state.score/state.cur*100):0)+'%</div><div class="stat-label">정답률</div></div>';
      const sl = document.getElementById('subject-list');
      sl.innerHTML = '';
      Object.entries(state.subjectStats).forEach(([name,s]) => {
        const p = s.total>0 ? Math.round((s.correct||0)/s.total*100) : 0;
        sl.innerHTML += '<div class="subject-row"><span style="font-size:14px;color:var(--text);flex:1;">'+name+'</span><div class="mini-bar-wrap"><div class="mini-bar" style="width:'+p+'%"></div></div><span class="pct">'+p+'%</span></div>';
      });
      document.getElementById('progress-mode-label').textContent = '현재 회차: ' + (state.mode === 'wrong' ? '오답노트 모드' : '랜덤 모드') + ' (총 ' + total + '문제)';
    }

    function renderWrong() {
      const wl = document.getElementById('wrong-list');
      const startBtn = document.getElementById('start-wrong-btn');
      if (!wrongList.length) {
        wl.innerHTML = '<p class="empty">아직 오답노트에 문제가 없어요! 문제를 틀리면 여기에 자동으로 쌓입니다.</p>';
        startBtn.style.display = 'none';
        return;
      }
      startBtn.style.display = '';
      startBtn.textContent = '오답노트 문제 풀기 (' + wrongList.length + '문제 중 최대 ' + WRONG_ROUND_SIZE + '문제 랜덤)';
      wl.innerHTML = wrongList.map(id => {
        const q = findQuestion(id);
        if (!q) return '';
        const streak = wrongStats[id] ? (wrongStats[id].streak||0) : 0;
        return '<div class="wrong-item"><p class="wrong-q">['+q.subject+'] '+q.q+'</p>'+
          '<p style="font-size:12px;color:var(--text2);">연속 정답 '+streak+' / '+WRONG_REMOVE_STREAK+' (연속 '+WRONG_REMOVE_STREAK+'회 맞히면 오답노트에서 자동 제거됩니다)</p></div>';
      }).join('');
    }

    function renderManage() {
      document.getElementById('q-total-badge').textContent = questions.length;
      const list = document.getElementById('q-manage-list');
      if (!questions.length) { list.innerHTML='<p class="empty">문제가 없습니다. 추가해보세요!</p>'; return; }
      list.innerHTML = questions.map(q =>
        '<div class="q-list-item"><div><p class="q-list-text">'+q.q+'</p><p class="q-list-sub">'+q.subject+' · 정답: '+(q.ans+1)+'번</p></div><button class="btn btn-danger" onclick="deleteQuestion('+q.id+')"><i class="ti ti-trash" aria-hidden="true"></i> 삭제</button></div>'
      ).join('');
    }

    fetch("questions.json").then(r => r.json()).then(data => {
      questions = data;
      nextId = questions.length ? Math.max(...questions.map(q => q.id)) + 1 : 1;
      startNormalRound();
    });
  </script>
</body>
</html>
